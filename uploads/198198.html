<!DOCTYPE html>

<body>
  



<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260812</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#1f2733; --sub:#5b6675;
  --accent:#e8603c; --line:#e6e9ee; --chip:#eef1f6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.85;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
article{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:44px 48px;box-shadow:0 6px 30px rgba(31,39,51,.06)}
h1{font-size:30px;line-height:1.4;margin:0 0 14px;letter-spacing:.01em}
.meta{color:var(--sub);font-size:13px;margin-bottom:22px;
  display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.meta .dot{width:4px;height:4px;border-radius:50%;background:var(--sub);opacity:.5}
.tags{margin:0 0 22px}
.tag{display:inline-block;background:var(--chip);color:var(--sub);font-size:12px;
  padding:4px 10px;border-radius:999px;margin:0 6px 6px 0}
.lead{font-size:17px;color:var(--ink);background:#fbf3f0;border-left:4px solid var(--accent);
  padding:16px 18px;border-radius:0 8px 8px 0;margin:0 0 30px}
.toc{background:#fafbfc;border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;margin:0 0 34px}
.toc-title{font-weight:700;font-size:14px;margin:0 0 8px;color:var(--sub)}
.toc ol{margin:0;padding-left:20px}
.toc a{color:var(--ink);text-decoration:none}
.toc a:hover{color:var(--accent);text-decoration:underline}
section{margin:0 0 30px}
h2{font-size:21px;margin:34px 0 12px;padding-left:12px;
  border-left:5px solid var(--accent);line-height:1.5}
p{margin:0 0 16px}
ul{margin:0 0 16px;padding-left:22px}
li{margin:0 0 8px}
strong{color:#b6472a}
hr{border:0;border-top:1px solid var(--line);margin:34px 0}
.source{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none}
.footer{color:var(--sub);font-size:12px;margin-top:8px}
@media(max-width:600px){article{padding:26px 20px}h1{font-size:24px}}
@media print{body{background:#fff}article{border:0;box-shadow:none;padding:0}.toc{break-inside:avoid}}
</style>


<div class="wrap">
<article>
  <h1>20260812</h1>
  <div class="meta">
    <span>読了目安 約10分</span><span class="dot"></span>
    <span>Vimeo→ブログ自動生成</span>
  </div>
  <div class="tags"><span class="tag">補助金</span><span class="tag">AI活用</span><span class="tag">マーケティング</span><span class="tag">行政書士</span></div>
  <p class="lead">特典追加したのでシェアします</p>
<div class="video-embed" style="position:relative;padding-top:56.25%;margin:0 0 30px;border-radius:12px;overflow:hidden;background:#000">
  <iframe src="https://player.vimeo.com/video/1217496125?h=daa1271a55" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen="" title="動画プレイヤー"></iframe>



</div></article></div>
</body>
</html>
