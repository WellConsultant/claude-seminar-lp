<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>マインドマップツール v3</title>
<style>
:root{--navy:#132238;--ink:#19202b;--muted:#697386;--line:#d9dee7;--panel:#fff;--bg:#f3f5f8;--accent:#b88935;--danger:#a63c3c}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);overflow:hidden;background:var(--bg)}
button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;box-shadow:0 2px 10px #0003;z-index:20;flex-wrap:wrap}.brand{font-size:16px;font-weight:800;margin-right:8px;white-space:nowrap}.ver{font-size:10px;color:#d5dae2;border:1px solid #ffffff45;border-radius:10px;padding:2px 6px}.group{display:flex;gap:5px;align-items:center;padding-left:8px;border-left:1px solid #ffffff30}.top button,.fileLabel{border:1px solid #ffffff35;background:#ffffff12;color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12px;white-space:nowrap}.top button:hover,.fileLabel:hover{background:#ffffff25}.top button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.top button.danger{color:#ffd7d7}.top input[type=color]{width:30px;height:30px;border:1px solid #ffffff55;border-radius:6px;padding:2px;background:transparent;cursor:pointer}.fileLabel input{display:none}
.main{min-height:0;display:grid;grid-template-columns:250px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto;z-index:10}.side h2{font-size:13px;margin:0 0 10px;color:var(--navy)}.side p,.side li{font-size:12px;line-height:1.65;color:var(--muted)}.side ul{padding-left:18px;margin:6px 0 16px}.field{margin:10px 0}.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}.status{margin-top:12px;padding:9px;background:#f5f1e9;border-left:3px solid var(--accent);font-size:11px;line-height:1.5;color:#625330}.canvasWrap{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(#cbd1db 1px,transparent 1px);background-size:22px 22px;cursor:grab}.canvasWrap.panning{cursor:grabbing}.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}.edges{position:absolute;overflow:visible;left:0;top:0;pointer-events:none}.nodes{position:absolute;left:0;top:0}.node{position:absolute;width:180px;min-height:58px;padding:11px 14px;border-radius:10px;background:#fff;border:2px solid #8994a4;box-shadow:0 3px 12px #2430431c;cursor:move;user-select:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;font-size:14px;font-weight:650;overflow-wrap:anywhere}.node.root{width:210px;min-height:72px;background:var(--navy);border-color:var(--navy);color:#fff;font-size:16px}.node.selected{outline:4px solid #b8893540;border-color:var(--accent)}.node.editing{cursor:text;user-select:text}.node textarea{width:100%;min-height:42px;resize:none;border:0;outline:0;background:transparent;color:inherit;font:inherit;text-align:center;line-height:1.35;padding:0}.edge{fill:none;stroke:#8994a4;stroke-width:3;stroke-linecap:round}.emptyHint{position:absolute;right:14px;bottom:12px;background:#ffffffdb;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--muted);pointer-events:none}.mobileToggle{display:none}
@media(max-width:760px){.main{grid-template-columns:1fr}.side{position:absolute;top:54px;bottom:0;left:0;width:260px;transform:translateX(-102%);transition:.2s;box-shadow:4px 0 14px #0002}.side.open{transform:none}.mobileToggle{display:inline-block}.brand{font-size:14px}.top{padding:6px}.top button,.fileLabel{padding:6px 8px}.group{padding-left:4px}}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <button class="mobileToggle" id="menuBtn">☰</button><span class="brand">Mind Map</span><span class="ver">v3</span>
  <div class="group"><button class="primary" id="addChild">＋ 子を追加</button><button id="addSibling">＋ 同階層</button><button class="danger" id="remove">削除</button></div>
  <div class="group"><button id="undo">↶ 戻す</button><button id="redo">↷ 進む</button><button id="layout">自動整列</button><button id="fit">全体表示</button></div>
  <div class="group"><button id="saveJson">保存</button><label class="fileLabel">読込<input id="loadJson" type="file" accept="application/json,.json"></label><button id="exportPng">PNG</button></div>
 </header>
 <main class="main">
  <aside class="side" id="side">
   <h2>選択中のノード</h2>
   <div class="field"><label>文字</label><input id="textInput" maxlength="300"></div>
   <div class="field"><label>背景色</label><input id="bgColor" type="color" value="#ffffff"></div>
   <div class="field"><label>文字色</label><input id="textColor" type="color" value="#19202b"></div>
   <div class="field"><label>枠色</label><input id="borderColor" type="color" value="#8994a4"></div>
   <div class="field"><label>文字サイズ</label><select id="fontSize"><option>12</option><option selected>14</option><option>16</option><option>18</option><option>20</option><option>24</option></select></div>
   <h2 style="margin-top:18px">使い方</h2>
   <ul><li>文字をクリックして直接編集</li><li><b>Tab</b>：子ノードを追加</li><li><b>Enter</b>：同階層ノードを追加</li><li><b>Shift＋Enter</b>：文字内で改行</li><li>ノードをドラッグして移動</li><li>Deleteキーで選択ノードを削除</li></ul>
   <p>内容はこのブラウザに自動保存されます。「保存」でJSONを保管すれば、別のPCでも続きから編集できます。</p>
   <div class="status" id="status">自動保存：有効</div>
  </aside>
  <section class="canvasWrap" id="canvas">
   <div class="world" id="world"><svg class="edges" id="edges"></svg><div class="nodes" id="nodes"></div></div>
   <div class="emptyHint">Tab：子を追加 ／ Enter：同階層を追加 ／ 文字クリック：編集</div>
  </section>
 </main>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), canvas=$('#canvas'),world=$('#world'),nodesEl=$('#nodes'),edges=$('#edges'),status=$('#status');
const STORAGE='mindmap_tool_v1_data'; let selected='root',pan={x:420,y:300},zoom=1,history=[],future=[],drag=null,panning=null,saveTimer;
const fresh=()=>({nodes:[{id:'root',parent:null,text:'中心テーマ',x:0,y:0,bg:'#132238',color:'#ffffff',border:'#132238',size:16},{id:'n1',parent:'root',text:'テーマ 1',x:300,y:-130,bg:'#ffffff',color:'#19202b',border:'#8994a4',size:14},{id:'n2',parent:'root',text:'テーマ 2',x:300,y:20,bg:'#ffffff',color:'#19202b',border:'#8994a4',size:14},{id:'n3',parent:'root',text:'テーマ 3',x:300,y:170,bg:'#ffffff',color:'#19202b',border:'#8994a4',size:14}]});
let data;try{data=JSON.parse(localStorage.getItem(STORAGE))||fresh()}catch(e){data=fresh()}
const node=id=>data.nodes.find(n=>n.id===id); const children=id=>data.nodes.filter(n=>n.parent===id);
function snapshot(){history.push(JSON.stringify(data));if(history.length>80)history.shift();future=[]}
function autosave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(STORAGE,JSON.stringify(data));status.textContent='自動保存：'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},180)}
function applyTransform(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`}
function edgePath(a,b){const aw=a.id==='root'?210:180, ah=a.id==='root'?72:58, bw=b.id==='root'?210:180,bh=b.id==='root'?72:58;const ac={x:a.x+aw/2,y:a.y+ah/2},bc={x:b.x+bw/2,y:b.y+bh/2};let x1=ac.x,y1=ac.y,x2=bc.x,y2=bc.y;if(Math.abs(bc.x-ac.x)>=Math.abs(bc.y-ac.y)){x1+=bc.x>ac.x?aw/2:-aw/2;x2+=bc.x>ac.x?-bw/2:bw/2}else{y1+=bc.y>ac.y?ah/2:-ah/2;y2+=bc.y>ac.y?-bh/2:bh/2}const dx=(x2-x1)*.5;return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`}
function renderEdges(){edges.innerHTML='';data.nodes.forEach(n=>{if(n.parent&&node(n.parent)){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('class','edge');p.setAttribute('d',edgePath(node(n.parent),n));p.setAttribute('stroke',n.border||'#8994a4');edges.appendChild(p)}})}
function markSelected(){document.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===selected));syncPanel()}
function render(){nodesEl.innerHTML='';renderEdges();data.nodes.forEach(n=>{const el=document.createElement('div');el.className='node'+(n.id==='root'?' root':'')+(n.id===selected?' selected':'');el.dataset.id=n.id;el.textContent=n.text;Object.assign(el.style,{left:n.x+'px',top:n.y+'px',background:n.bg,color:n.color,borderColor:n.border,fontSize:n.size+'px'});nodesEl.appendChild(el)});syncPanel();applyTransform();autosave()}
function syncPanel(){const n=node(selected);if(!n){selected='root';return syncPanel()}$('#textInput').value=n.text;$('#bgColor').value=n.bg;$('#textColor').value=n.color;$('#borderColor').value=n.border;$('#fontSize').value=String(n.size)}
function shiftBranch(id,dy){const n=node(id);if(n)n.y+=dy;children(id).forEach(c=>shiftBranch(c.id,dy))}
function add(parentId,afterId=null){snapshot();const p=node(parentId)||node('root'),siblings=children(parentId),gap=120;let x=p.x+280,y=p.y;if(siblings.length){x=siblings[0].x;if(afterId&&node(afterId)){const anchor=node(afterId);x=anchor.x;y=anchor.y+gap;siblings.filter(s=>s.id!==afterId&&s.y>anchor.y).sort((a,b)=>b.y-a.y).forEach(s=>shiftBranch(s.id,gap))}else y=Math.max(...siblings.map(s=>s.y))+gap}const id='n'+Date.now().toString(36);data.nodes.push({id,parent:parentId,text:'新しい項目',x,y,bg:'#ffffff',color:'#19202b',border:'#8994a4',size:14});selected=id;render();setTimeout(()=>startEdit(document.querySelector(`[data-id="${id}"]`)),0)}
function addSiblingOf(id){const n=node(id);if(n&&n.parent)add(n.parent,n.id);else add(n?n.id:'root')}
function removeSelected(){if(selected==='root'){alert('中心テーマは削除できません');return}snapshot();const doomed=new Set([selected]);let changed=true;while(changed){changed=false;data.nodes.forEach(n=>{if(n.parent&&doomed.has(n.parent)&&!doomed.has(n.id)){doomed.add(n.id);changed=true}})}data.nodes=data.nodes.filter(n=>!doomed.has(n.id));selected='root';render()}
function startEdit(el){if(!el)return;const n=node(el.dataset.id),editingId=n.id;el.classList.add('editing');const ta=document.createElement('textarea');ta.value=n.text;el.textContent='';el.appendChild(ta);ta.focus();ta.select();let old=n.text,done=false;const finish=()=>{if(done)return;done=true;const v=ta.value.trim()||'無題';if(v!==old){snapshot();n.text=v}render()};ta.addEventListener('blur',finish);ta.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Escape'){e.preventDefault();ta.value=old;finish();return}if(e.key==='Tab'){e.preventDefault();finish();setTimeout(()=>add(editingId),0);return}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();finish();setTimeout(()=>addSiblingOf(editingId),0)}})}
nodesEl.addEventListener('pointerdown',e=>{const el=e.target.closest('.node');if(!el||e.target.tagName==='TEXTAREA')return;e.stopPropagation();selected=el.dataset.id;markSelected();const n=node(selected);snapshot();drag={id:n.id,x:e.clientX,y:e.clientY,nx:n.x,ny:n.y,moved:false,el};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;const n=node(drag.id);n.x=drag.nx+dx/zoom;n.y=drag.ny+dy/zoom;drag.el.style.left=n.x+'px';drag.el.style.top=n.y+'px';renderEdges()});
document.addEventListener('pointerup',()=>{if(!drag)return;const clicked=!drag.moved,el=drag.el;if(clicked)history.pop();else autosave();drag=null;if(clicked)setTimeout(()=>startEdit(el),0)});
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;panning={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};canvas.classList.add('panning');canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!panning)return;pan.x=panning.px+e.clientX-panning.x;pan.y=panning.py+e.clientY-panning.y;applyTransform()});canvas.addEventListener('pointerup',()=>{panning=null;canvas.classList.remove('panning')});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=zoom;zoom=Math.max(.25,Math.min(2.5,zoom*(e.deltaY<0?1.1:.9)));pan.x=mx-(mx-pan.x)*(zoom/old);pan.y=my-(my-pan.y)*(zoom/old);applyTransform()},{passive:false});
$('#addChild').onclick=()=>add(selected);$('#addSibling').onclick=()=>addSiblingOf(selected);$('#remove').onclick=removeSelected;
$('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(data));data=JSON.parse(history.pop());selected=node(selected)?selected:'root';render()};$('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(data));data=JSON.parse(future.pop());selected=node(selected)?selected:'root';render()};
function layout(){snapshot();const gapX=290,gapY=120;function leaves(id){const cs=children(id);return cs.length?cs.reduce((s,c)=>s+leaves(c.id),0):1}function place(id,depth,top){const n=node(id),cs=children(id),span=leaves(id)*gapY;n.x=depth*gapX;n.y=top+span/2-(id==='root'?36:29);let y=top;cs.forEach(c=>{place(c.id,depth+1,y);y+=leaves(c.id)*gapY})}place('root',0,-leaves('root')*gapY/2);render();fitView()}
$('#layout').onclick=layout;function fitView(){const xs=data.nodes.flatMap(n=>[n.x,n.x+(n.id==='root'?210:180)]),ys=data.nodes.flatMap(n=>[n.y,n.y+(n.id==='root'?72:58)]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),r=canvas.getBoundingClientRect();zoom=Math.max(.25,Math.min(1.25,Math.min((r.width-80)/(maxX-minX||1),(r.height-80)/(maxY-minY||1))));pan.x=(r.width-(minX+maxX)*zoom)/2;pan.y=(r.height-(minY+maxY)*zoom)/2;applyTransform()}$('#fit').onclick=fitView;
['textInput','bgColor','textColor','borderColor','fontSize'].forEach(id=>$('#'+id).addEventListener('change',e=>{snapshot();const n=node(selected);if(id==='textInput')n.text=e.target.value.trim()||'無題';if(id==='bgColor')n.bg=e.target.value;if(id==='textColor')n.color=e.target.value;if(id==='borderColor')n.border=e.target.value;if(id==='fontSize')n.size=+e.target.value;render()}));
$('#saveJson').onclick=()=>download(new Blob([JSON.stringify({version:1,data},null,2)],{type:'application/json'}),'mindmap_'+dateStamp()+'.json');$('#loadJson').onchange=async e=>{try{const raw=JSON.parse(await e.target.files[0].text()),incoming=raw.data||raw;if(!Array.isArray(incoming.nodes)||!incoming.nodes.some(n=>n.id==='root'))throw Error();snapshot();data=incoming;selected='root';render();fitView()}catch(err){alert('読み込めるマインドマップデータではありません')}e.target.value=''};
function dateStamp(){return new Date().toISOString().slice(0,10)}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#exportPng').onclick=()=>{const els=[...document.querySelectorAll('.node')],xs=data.nodes.flatMap(n=>[n.x,n.x+(n.id==='root'?210:180)]),ys=data.nodes.flatMap(n=>[n.y,n.y+(n.id==='root'?72:58)]),minX=Math.min(...xs)-35,maxX=Math.max(...xs)+35,minY=Math.min(...ys)-35,maxY=Math.max(...ys)+35,w=Math.ceil(maxX-minX),h=Math.ceil(maxY-minY);let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${minX} ${minY} ${w} ${h}"><rect x="${minX}" y="${minY}" width="${w}" height="${h}" fill="#f3f5f8"/>`;data.nodes.forEach(n=>{if(n.parent&&node(n.parent))svg+=`<path d="${edgePath(node(n.parent),n)}" fill="none" stroke="${n.border}" stroke-width="3" stroke-linecap="round"/>`});data.nodes.forEach(n=>{const nw=n.id==='root'?210:180,nh=n.id==='root'?72:58,lines=wrap(n.text,nw/8),start=n.y+nh/2-(lines.length-1)*n.size*.68;svg+=`<rect x="${n.x}" y="${n.y}" width="${nw}" height="${nh}" rx="10" fill="${n.bg}" stroke="${n.border}" stroke-width="2"/>`;lines.forEach((line,i)=>svg+=`<text x="${n.x+nw/2}" y="${start+i*n.size*1.35}" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="${n.size}" font-weight="600" fill="${n.color}">${escapeXml(line)}</text>`)});svg+='</svg>';const img=new Image(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(2,4000/Math.max(w,h));c.width=w*scale;c.height=h*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>download(b,'mindmap_'+dateStamp()+'.png'));URL.revokeObjectURL(url)};img.src=url};
function wrap(s,max){const out=[];for(const para of s.split('\n')){let line='';for(const ch of para){if((line+ch).length>max){out.push(line);line=ch}else line+=ch}out.push(line)}return out.slice(0,5)}function escapeXml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.isComposing||e.keyCode===229)return;if(e.key==='Delete'||e.key==='Backspace')removeSelected();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#redo').click():$('#undo').click()}if(e.key==='Tab'){e.preventDefault();add(selected)}if(e.key==='Enter'){e.preventDefault();addSiblingOf(selected)}});$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');window.addEventListener('resize',applyTransform);render();setTimeout(fitView,100);
})();
</script>
</body>
</html>
