<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>持続化補助金 見出し別プロンプト作成ツール</title>
  <style>
    :root{--navy:#111f35;--navy2:#1d2d46;--ink:#172033;--muted:#687386;--line:#d9dee7;--soft:#f4f6f8;--white:#fff;--ok:#2d6846;--warn:#7c5411}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#eef1f5}
    button,textarea,input{font:inherit}button{cursor:pointer}
    .top{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
    .brand{font-weight:700;letter-spacing:.03em}.brand small{font-weight:400;color:#c9d0da;margin-left:12px}
    .save-state{font-size:12px;color:#d5dbe4}
    .layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 58px)}
    aside{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
    .nav-title{font-size:12px;color:var(--muted);font-weight:700;margin:0 8px 8px}
    .step{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:6px;color:#283448;line-height:1.35}
    .step:hover{background:var(--soft)}.step.active{background:var(--navy);color:#fff}
    .num{flex:0 0 24px;height:24px;border:1px solid #aab2bf;border-radius:50%;display:grid;place-items:center;font-size:11px}
    .step.active .num{border-color:#fff}.phase{font-size:11px;opacity:.7;display:block;margin-bottom:2px}
    main{padding:22px;min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
    .panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .panel-head h2,.panel-head h3{font-size:16px;margin:0}.panel-body{padding:16px}
    .intro{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.intro h1{font-size:23px;margin:0 0 6px;color:var(--navy)}.intro p{margin:0;color:var(--muted);font-size:13px}
    .tabs{display:flex;border-bottom:1px solid var(--line);background:#fafbfc;overflow:auto}.tab{border:0;border-right:1px solid var(--line);background:transparent;padding:12px 17px;white-space:nowrap;color:#4d586a}.tab.active{background:#fff;color:var(--navy);font-weight:700;border-top:3px solid var(--navy);padding-top:9px}
    .tabpage{display:none}.tabpage.active{display:block}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.hint{font-size:12px;color:var(--muted);font-weight:400}
    textarea{width:100%;min-height:190px;border:1px solid #bfc7d2;border-radius:5px;padding:12px;line-height:1.65;resize:vertical;background:#fff}
    textarea:focus{outline:2px solid #8c99aa;outline-offset:1px;border-color:#6d7889}
    .reference{min-height:300px}.prompt{min-height:430px;font-family:"SFMono-Regular",Consolas,monospace;font-size:13px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.meta{font-size:12px;color:var(--muted)}
    .btn{border:1px solid #9ca6b5;background:#fff;color:#243148;border-radius:5px;padding:9px 14px;font-weight:650}.btn:hover{background:#f1f3f6}
    .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy2)}
    .btn.danger{color:#7b2631}.file{font-size:12px}.notice{padding:10px 12px;border-left:4px solid var(--navy);background:#f1f3f6;font-size:13px;line-height:1.55}
    .review{margin-top:10px;padding:12px;border:1px solid #d7dce4;background:#fafbfc;border-radius:5px;font-size:13px;line-height:1.6}
    .counts{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:8px;margin-top:10px}.count{background:var(--soft);padding:9px 11px;border-radius:5px;font-size:12px}.count b{display:block;font-size:17px;color:var(--navy)}
    .footer-actions{position:sticky;bottom:0;background:rgba(238,241,245,.96);padding:10px 0;display:flex;gap:8px;justify-content:flex-end}
    .toast{position:fixed;right:20px;bottom:20px;background:#152239;color:#fff;padding:11px 15px;border-radius:5px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}
    @media(max-width:820px){.top{height:auto;min-height:56px;padding:12px 15px}.brand small{display:block;margin:2px 0 0}.layout{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:9px}.nav-title{display:none}.step{min-width:185px}.step.active{background:var(--navy)}main{padding:12px}.intro{display:block}.intro .row{margin-top:12px}.counts{grid-template-columns:1fr}.panel-body{padding:13px}.prompt{min-height:360px}.right{margin-left:0}}
    @media print{.top,aside,.tabs,.footer-actions,.panel:first-child,.panel-head button,.file{display:none!important}.layout{display:block}main{padding:0}.panel{border:0}.tabpage{display:block!important}textarea{border:0;min-height:auto}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">持続化補助金 見出し別プロンプト作成ツール <small>事業計画書作成用</small></div>
    <div class="save-state" id="saveState">ブラウザ内に自動保存</div>
  </header>
  <div class="layout">
    <aside><div class="nav-title">見出しを選択</div><div id="sectionNav"></div></aside>
    <main>
      <section class="panel">
        <div class="panel-body intro">
          <div><h1 id="currentTitle">基本データを入力してください</h1><p>基本データは1回入力すれば全見出しに共通適用されます。参考フォーマットだけが見出しごとに切り替わります。</p></div>
          <div class="row"><button class="btn" id="copyAll">全見出しをコピー</button><button class="btn" id="downloadAll">TXT保存</button></div>
        </div>
      </section>
      <section class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="basic">基本データ</button>
          <button class="tab" data-tab="source">参考資料</button>
          <button class="tab" data-tab="formatsetup">参考フォーマット設定</button>
          <button class="tab" data-tab="format">見出し別見本</button>
          <button class="tab" data-tab="rules">ルール</button>
          <button class="tab" data-tab="instruction">指示内容</button>
        </div>
        <div class="panel-body">
          <div class="tabpage active" id="tab-basic">
            <label>会社・顧客・商品・数値などの独自情報 <span class="hint">ユーザーが準備した基本データを貼り付け</span></label>
            <textarea id="basicData" placeholder="会社概要、既存事業、顧客、商品・サービス、売上、課題、補助事業の内容、見積内容、実施スケジュールなどを貼り付けてください。"></textarea>
            <div class="row" style="margin-top:10px"><input class="file" id="basicFile" type="file" accept=".txt,.md,.csv,.json"><span class="meta">TXT・MD・CSV・JSONを読み込めます</span></div>
          </div>
          <div class="tabpage" id="tab-source">
            <label>参考資料 <span class="hint">添付された r6_koubover8_ip20.pdf（44ページ）を全文組み込み済み</span></label>
            <textarea id="sourceData" readonly></textarea>
            <div class="row" style="margin-top:10px"><span class="meta">この参考資料は全見出しのプロンプトに共通で使用されます。</span></div>
          </div>
          <div class="tabpage" id="tab-formatsetup">
            <label>参考フォーマット全体 <span class="hint">最初に1回セットすると、見出しごとに自動分解して適用</span></label>
            <textarea class="reference" id="formatMaster" placeholder="見出しを含む参考フォーマット全体を貼り付けるか、Markdown／TXTファイルを読み込んでください。"></textarea>
            <div class="row" style="margin-top:10px">
              <input class="file" id="formatFile" type="file" accept=".txt,.md">
              <button class="btn primary" id="applyFormat">見出しごとに分解して適用</button>
              <span class="meta" id="formatStatus">初期テンプレートを設定済み</span>
            </div>
          </div>
          <div class="tabpage" id="tab-format">
            <label>選択中の見出しの見本 <span class="hint">添付テンプレートから自動設定。必要なら編集可能</span></label>
            <textarea class="reference" id="referenceData"></textarea>
            <div class="counts"><div class="count">見本文字数<b id="refCount">0</b></div><div class="count">表の数<b id="tableCount">0</b></div><div class="count">出力目安<b id="targetCount">0</b></div></div>
          </div>
          <div class="tabpage" id="tab-rules">
            <label>全見出し共通の制約</label>
            <textarea id="rulesData"></textarea>
          </div>
          <div class="tabpage" id="tab-instruction">
            <label>指示内容 <span class="hint">全見出し共通</span></label>
            <textarea id="instructionData" readonly>審査の観点を意識した事業計画書を作ること</textarea>
          </div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>生成されたプロンプト</h2><div class="row"><span class="meta" id="promptCount">0文字</span><button class="btn primary" id="copyPrompt">このプロンプトをコピー</button></div></div>
        <div class="panel-body">
          <div class="notice">この文章をChatGPT等へ貼り付けてください。出力後は、基本データにない事実や数値が混ざっていないか必ず確認してください。</div>
          <textarea class="prompt" id="promptOutput" readonly></textarea>
        </div>
      </section>
      <div class="footer-actions"><button class="btn danger" id="resetAll">入力内容を初期化</button><button class="btn" id="prevSection">前の見出し</button><button class="btn primary" id="nextSection">次の見出し</button></div>
    </main>
  </div>
  <div class="toast" id="toast">コピーしました</div>
  <script>
    const SECTIONS = [{"id":"前半-1","phase":"前半","title":"1-1.自社の概要","content":"当社は、⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎にて、介護・福祉に従事したい人や、介護福祉事業者向けの研修・コンサルティング事業・不動産事業向けの居住支援等を営んでいる。当社の概要は以下の通りでです。\n\n**※今回の事業は、障害福祉事業に関わる物ではなく、補助対象外事業である「国が助成する他の制度と同一または類似内容の事業に該当しません。**\n\n| 会社名 | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ |\n| :---- | :---- |\n| 創業年月 | 2015年2月3日 |\n| 業務内容 | **本事業 ・研修事業（本事業で実施する事業） ターゲット： ・介護・福祉事業に従事したい個人の方 ・介護福祉の人手不足に悩む企業** 既存事業 ・障害福祉事業 |\n| 代表者名 | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ |\n| 本店所在地 | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ |\n| 当社の持ち味・得意ジャンル | ・代表は倫理法人会の役員を務め、地域の経営者との密接な関係を維持している ・創業10年間、障害福祉事業に従事した、経験・ノウハウが蓄積されている ・船井総研などの外部研修に積極的に参加し（従業員含む）、時流と新鮮な情報収集を継続して行なっている |\n| 主要客層 | 精神・知的障がいのある方とその家族、障害福祉事業者、不動産事業者 |\n| 経営理念 | 共に生きる社会を目指して |\n|  |  |","reviewPoint":"自社の沿革、事業内容、顧客、地域との関係、保有資源を事実に基づいて具体化し、事業者の実態が短時間で伝わる構成にする。"},{"id":"前半-2","phase":"前半","title":"1-2.現在の売上・利益の状況","content":"当社の社内全体の売上利益の状況は以下のとおりです。\n\n| 項目 | 第7期（R3.8） | 第8期（R4.8） | 第9期（R5.8） | 第10期（R6.8） |\n| ----- | ----- | ----- | ----- | ----- |\n| 売上高 | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ |\n| 営業利益 | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ | ⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎ |\n\n上記の通り、⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎では**第7期〜第10期にかけて売上高が着実に増加**しており、**年平均約20%前後の成長率**で推移しています。これは、グループホームや就労支援といった福祉サービスの拡充により、地域ニーズを的確に捉えた結果と評価できます。\n\n一方で、営業利益は第7期で大きな赤字を計上しており、徐々に改善を見せているものの、**第10期時点でも営業利益率は1.9%に留まる**など、収益構造にはなお課題が残されています。特に第10期の**販売費及び一般管理費が223,671千円に上り、売上高の約98%を占めている**ことから、**高コスト体質の是正**が急務です。\n\nこの背景には、利用者支援の質を確保するための**人件費の高騰**や、施設運営にかかる固定費、コンサル・広告などの戦略的投資が含まれています。**現在はあえて支援の質と組織体制の構築を優先した投資フェーズ**にあるとも言えます。\n\n今後は、既存サービスの運営効率化とともに、\\*\\*収益性の高い新規事業（研修事業・採用支援）\\*\\*の展開により、全体の利益体質を改善し、**債務超過の解消および財務体質の健全化**を図り、自社の理念追求の取り組みを行うことが急務と考えています。そのため、本事業を軸に、お客様からも、従業員からも、選ばれる会社になるために、本事業に挑むことにしました。","reviewPoint":"売上・利益の推移を数値で示し、増減の理由と現在の収益構造を分析する。数値を羅列せず、補助事業が必要となる経営上の背景につなげる。"},{"id":"前半-3","phase":"前半","title":"1-3.経営課題","content":"当社の経営課題は以下の通りと考えております。  \n介護・福祉に従事したい人や、介護福祉事業者向けの研修・コンサルティング事業においての経営課題は以下のとおりです。\n\n| 分野 | 経営課題 |\n| ----- | ----- |\n| リスト（営業・収益） | ・受動的な受身体制にて現状運営している ・能動的な顧客への提案が課題 |\n| 商品（開発・提供） | ・オンデマンドとリアルでの対応を強みとして活用できるが、打ち出せていない。 |\n| 独自性（技術・差別化） | ・他法人との差別化が打ち出しきれていない ・大手研修会社との差別化ポイントである「アットホームさ」「地域との連携」「自己決定支援」などの特徴を、言語化・可視化できていない |\n| 組織（人材・体制） | ・経営幹部・営業・商品開発・事業推進を担う中核人材が不足している・若手育成やOJTに頼った体制のままで、成長投資に耐えるマネジメント体制が脆弱・営業機能が未成熟で、紹介・行政ルートに依存した受け身の営業に留まっている |\n\n自社においては、前述の財務体質や今後の経営体質改善のために、私たちの強みや経験などの価値を地域や社会に伝えるための営業・情報発信の仕組みが途上であることが、最大の経営課題と考えています。\n\n本事業においては、当社の強みである「障がい者福祉支援・人材育成ノウハウ」を活用し、法人向けの**教育研修パッケージ事業**を軸とする、\\*\\*“新たな価値提供モデルの構築”\\*\\*に挑みます。  \n これにより、既存の介護・福祉法人が抱える人材定着・教育コストの課題に応え、社会課題の解決にも貢献します。\n\n本事業を通じて、私たちの10年にわたる経験や現場知見、全国ネットワーク（倫理法人会等）を活用し、**収益性と社会性を両立したモデルへの転換**を図ることが、次の10年に向けた最大の経営戦略であると確信しています。","reviewPoint":"最優先で解決すべき課題を絞り込み、課題の原因、放置した場合の影響、補助事業との因果関係を明確にする。"},{"id":"前半-4","phase":"前半","title":"2.顧客ニーズと市場動向","content":"### **2-1.市場の動向**\n\n当社が取り組んでいる事業は、介護・福祉分野における「採用後教育」や「現場定着支援」に焦点を当てた、研修支援プラットフォームの構築です。私たちが身を置く市場である、介護・福祉業界の人材育成・人材確保に関わる市場動向は以下のとおりです。\n\n**介護・福祉分野の人材不足は深刻化**\n\n厚生労働省の調査によると、**2025年度には約32万人、2040年度には約69万人の介護人材が不足する**とされています。介護職の有効求人倍率は**3.97倍**と、全職業平均（1.16倍）を大きく上回る水準で推移しています。\n\n* 出典：\n\n  * 厚生労働省「介護人材の現状と確保対策」\n\n  * [https://www.mhlw.go.jp/content/12000000/001485589.pdf](https://www.mhlw.go.jp/content/12000000/001485589.pdf)\n\n  * CRASAPO「第8期介護保険事業計画に基づく人材推計」\n\n  * [https://crasapo.net/column/shortage-of-nursing-care-workers/](https://crasapo.net/column/shortage-of-nursing-care-workers/)\n\n**離職率の高さと処遇改善の課題**\n\n離職理由としては、給与水準や精神的負担が多く挙げられており、**職場環境の改善やキャリア支援、教育体制の整備が急務**とされています。また、外国人材の受け入れ（特定技能・EPAなど）も拡大しており、多様な人材への適応も課題となっています。\n\n---\n\n**中長期的な動向・技術革新の影響**\n\n経済産業省や厚労省は、介護ロボットやAI、ICTによる業務支援を推進しており、**「技術の補完による人材不足対応」が国策レベルで進行中です。特にAI支援型研修や、オンライン教育による未経験者・外国人対応型の教育体制構築**が今後の大きな潮流といえます。\n\n* 出典：\n\n  * Reuters「AI robots may hold key to nursing Japan's ageing population」2025年2月\n\n---\n\n上記の市場動向から、下記の市場機会があると考えています。\n\n* \\*\\*介護施設側の課題（人が来ない／辞める）\\*\\*を、採用だけでなく「教育と定着」という形でサポートできるサービスへのニーズが高まっている。(自社ノウハウを活かした研修事業)\n\nいま、介護や福祉の現場では、「人材の質を高め、安心して長く働ける環境をどうつくるか？」という課題が大きくなっています。  \n そうした背景を受けて、私たちは“人材の育成と定着”を支える教育の仕組みを、自社で提供していく必要があると感じています。\n\n現場から生まれた実践的なノウハウと、テクノロジーの力を組み合わせることで、介護・福祉分野における新しい研修プラットフォームを立ち上げ、これからの人材支援のあり方をかたちにするための「仕組み化」が急務であり課題であると考えております。\n\n\n### **2-2.顧客ニーズ**\n\n前述の市場動向・市場機会から、自社の、今取り組むべき製品と認識している製品とターゲット・ターゲットニーズは以下のとおりと考えています。\n\n---\n\n### **【製品とターゲット】**\n\n\n| No. | 製品名 | 主なターゲット層 |\n| ----- | ----- | ----- |\n| ❶ | 介護福祉事業者向け 教育研修支援パッケージ（単発型） | 小規模介護福祉事業者（グループホーム、デイサービス等）の管理者、現場リーダー層（未経験・外国人採用に課題を感じる法人） |\n| ❷ | 外国人スタッフ・未経験者向け実践研修（ガイドヘルパー研修等） | 外国人スタッフの採用を始めたばかりの中小法人／教育体制構築に悩む事業者 |\n| ❸ | 研修定着支援コンサルティング（顧問型サポート） | 人手不足が深刻で、研修を社内に定着させる支援の戦略が立てられていない法人全般（採用難・離職多発法人） |\n\n---\n\n### **【ターゲットニーズ】**\n\n| No. | 概要（顧客ニーズを含む） |\n| ----- | ----- |\n| ❶ | 新人スタッフが即戦力化できない。OJTに頼りきりで、教育の標準化ができていない。マニュアルがあっても運用されない。忙しくて新人に丁寧に教える時間がない。現場ごとのバラつきを解消したい。 |\n| ❷ | コンサルティングや専門家の研修会社ではなく、同業者から、真の情報、現場の情報を聞きたい、というニーズが多い。 |\n| ❸ | 採用してもすぐ辞めてしまう。採用広報や説明会のノウハウがない。ハローワーク・Indeed以外の採用手段がわからない。採用後のフォローが属人的で、定着までのプロセスが不透明。 |\n\n---\n\n当社のサービスは、現場実務に基づいた動画コンテンツと、少人数法人でも運用できる教育テンプレートの組み合わせにより、\\*\\*「教育コストの削減」「定着率向上」「採用後の即戦力化」\\*\\*というニーズに応えます。  \n 試験導入法人では、「外国人が安心して働けるようになった」「教育の属人化が解消されてきた」といったフィードバックがあり、今後さらなる展開が期待されています。","reviewPoint":"公的統計など出典を示せる市場情報と、自社が把握している具体的な顧客の困りごとを分けて記載し、市場機会を客観的に説明する。"},{"id":"前半-5","phase":"前半","title":"3.自社や自社の提供する商品・サービスの強み・弱み","content":"自社や自社の提供する商品・サービスの強み・弱みは、以下のとおりです。\n\n**✅ 自社全体の強み・弱み**\n\n****\n\n| 強み | 実践知に基づく教育ノウハウ | 10年以上にわたる障がい福祉運営と採用・教育現場の知見を活用。外国人・若手・未経験者まで幅広く対応。 |\n| :---- | :---- | :---- |\n| 強み | 教育資産の内製と即時転用力 | 動画教材・OJTマニュアル等をすでに社内運用中。すぐに外販用として転用可能な仕組みあり。障害のある方の外出を支援する（ガイドヘルプ）ために必要な公的指定を受けている。（助成金等は一才発生しない指定） |\n| 強み | ネットワーク・信頼構築基盤 | 倫理法人会などで10年以上のネットワークを有し、他法人との連携展開に強み。 |\n| 弱み | 知名度の限定性 | 実績はあるものの、全国的な認知はまだ低く、初期拡販における広報・紹介体制の強化が必要。 |\n| 弱み | 商品設計の精緻化余地 | パッケージ内容・価格帯・販売モデルがまだ流動的であり、実証と設計が並行段階。 |\n\n### ---\n\n### ✅ サービス（製品）の強み・弱み\n\n\n| 強み | 「現場目線」の教育設計 | 一般論ではなく、現場での困りごと（すぐ辞める、育てられない）に基づく設計。 |\n| :---- | :---- | :---- |\n| 強み | 多様な人材に対応可能 | 外国人・未経験・若手・ベテラン職員向けにモジュール化された研修が可能。 |\n| 強み | 即導入できる仕組み | 既に社内で実績があるため、現場展開しやすい。導入支援までワンパッケージ。 |\n| 弱み | 技術的訴求に偏りがち | 商品紹介において“何ができるか”は説明できるが、“なぜ必要か”の共感形成が弱い。 |\n| 弱み | セールス・導入支援体制の構築途上 | 営業・アフターサポートの専任体制がまだ整っておらず、スケール展開に向けた組織整備が必要。 |\n\n### \n\n### \n\n### **クロスSWOT分析**\n\n### **🔹 強み × 機会（Strength × Opportunity）**\n\n| 強み | 機会 | 活用戦略 |\n| ----- | ----- | ----- |\n| 実践知に基づく教育ノウハウ | 現場リーダー層の人手不足・新人定着ニーズの拡大 | 採用〜教育の一体型パッケージとして価値提案し、短期間で「戦力化」できる仕組みとして訴求 |\n| 教育資産の内製と即時転用力 | 「現場で使える教材」へのニーズ増 | 既存教材を「現場で即使える教育キット」として外販し、少人数法人でも導入可能な形に展開 |\n| ネットワーク・信頼構築基盤 | 倫理法人会など対法人チャネルの活用可能性 | 既存の異業種ネットワークを活用し、他法人への先行導入モデルの確立と紹介連鎖を構築 |\n\n---\n\n### **🔹 弱み × 機会（Weakness × Opportunity）**\n\n| 弱み | 機会 | 克服アプローチ |\n| ----- | ----- | ----- |\n| 知名度が限定的 | 同業他社との差別化ニーズの高まり | 「現場起点・即戦力化」の独自性を明文化し、導入事例や定着率データを活用した信頼性訴求を強化 |\n| 商品設計の精緻化余地 | 自治体・法人による導入補助制度の活用可能性 | 公的支援制度とセットで提案するモデルを整備し、価格帯や導入手順を明確化した販売ツールを整備 |\n| セールス・導入支援体制の構築途上 | 現場課題に直結する実務型研修の希少性 | 小規模スタートでの実績蓄積と並行して、支援チームを育成・拡張し全国展開に備える |\n\n当社には「現場起点で積み上げた教育ノウハウ」と「即活用可能な内製資産」という強みがある一方、それらを**外部に伝える仕組みが未整備**である点が大きな課題であると考えています。今後、自立した事業展開をしていく上で、急務であり、今以上の雇用拡大を創出できる点からも、本事業は社会的にも、自社の成長促進のためにも、また、従業員の可能性を活かせる場を作る意味でも重要な事業であると考えています。\n\n\n今回の事業は、単に研修パッケージを売ることが目的ではなく、**この“伝わる仕組み”そのものを構築・展開することが核心**です。私たちが現場で実証してきた内容を、他法人でも“そのまま”使える形に整え、必要とする人へ確実に届く導線を設計する──その一連の流れこそが、本事業の本質です。\n\nだからこそ、これまで内向きに機能していた価値を、社会へと橋渡しする「仕組みづくり」に全力で取り組みます。当社の強みを、“知っている人だけのもの”で終わらせず、業界全体の課題解決に貢献する基盤として育てていきます。","reviewPoint":"競合との違いが分かる強み・弱みを、実績、技術、経験、顧客評価などの根拠とともに示す。強みを補助事業でどう生かすかまでつなげる。"},{"id":"前半-6","phase":"前半","title":"4-1.経営方針・目標","content":"**❶経営方針**  \n---\n\n\n### **❶経営方針**\n\n\n当社の当面の経営方針は、「自社の強みを活かし、それを外部に届ける仕組みを構築すること」です。  \n 課題と、それに対する解決策（経営方針）は以下の通りです。\n\n| 分野 | 経営課題 | 経営方針（解決策） |\n| ----- | ----- | ----- |\n| リスト（営業・収益） | 収益事業としての収益の拡張性が低い。採用・教育活動にかかる固定費が重く、収益化できていない。 | 自社の研修・教育ノウハウを収益化する研修事業を展開し、営業体として整備。教育資産を活用した新収益モデルを確立。 |\n| 商品（開発・提供） | 教育ノウハウは豊富だが、商品化・伝達手段が未整備で、属人的対応に偏っている。 | 動画・テンプレ・マニュアルを統合した「パッケージ型研修商品」として体系化し、汎用性と導入のしやすさを強化。特に法人をターゲットにすることでさらに単価拡大を図る。 |\n| 独自性（技術・差別化） | 「アットホームな支援」「重度障がい者対応」などの強みが埋もれており、外部へ伝わっていない。 | 「即戦力化」「外国人対応」など具体的効果・自社ノウハウに基づく訴求軸を明文化し、導入法人での成果を可視化。 |\n| 組織（人材・体制） | 商品開発・営業・広報を担う中核人材が不足。内向き運用から外向き展開への組織転換が必要。 | 外部パートナーや実務人材（弁護士などの士業含む）を活用しながら、段階的に営業・サポート体制を構築し、研修事業部門を確立。 |\n\n---\n\n当社には、\\*\\*「現場起点の実践ノウハウ」**と、**「即時活用できる内製教育資産」\\*\\*という明確な強みがあります。 しかし、それらを **社会に伝え、広げる仕組み（伝達体制・営業体制）** がこれまで十分に整っていなかったことが、最大の経営課題でした。だからこそ、今回の事業では、研修商品そのものが**“伝わる仕組み”を構築・展開すること**を目的としています。\n\n本事業を通じて、社内に蓄積された採用・教育ノウハウを「仕組み」として他法人へ届け、**収益化・社会貢献・人材支援を同時に実現できるモデル**を確立していきます。\n\n**❷目標**\n\n**認知度向上とリード獲得の仕組み・商談化の仕組みづくりを行い、下記の目標設定を経て、実践していきます。**\n\n| 年度 | 資料請求数（件） | 体験会（件） | 商談化（件） | 成約（件） | 売上（千円） |\n| ----- | ----- | ----- | ----- | ----- | ----- |\n| **2025年度（0年目）** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** |\n| **2026年度（1年目）** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** |\n| **2027年度（2年目）** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** |\n| **2028年度（3年目）** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** | **⚫︎⚫︎⚫︎⚫︎⚫︎⚫︎** |\n\n※目標試算の前提（前提は、外部専門家による参考数値、平均移行率の7掛けで試算しています）　  \n単価：**50万円（500,000円）／件、**資料請求 → 体験会の移行率：**10%、**体験会 → 商談化率：**50%、**商談化 → 成約率：**50%**","reviewPoint":"経営課題を踏まえた中長期の方針と、補助事業後に到達したい状態を一貫させる。定量目標と定性目標を区別して示す。"},{"id":"前半-8","phase":"前半","title":"4-2.今後のプラン","content":"今後の行為計画は以下のとおりです。なお、詳細かつ具体的な補助事業計画は別紙にて記載しています。\n\n| 項目 | 具体的な取り組み内容 | 実施時期・期限 |\n| ----- | ----- | ----- |\n| リード獲得の仕組み整備 | ・診断付きの案内資料の整備 ・倫理法人会や紹介ネットワークを活用した案内 | 2025年6月〜8月 |\n| リードマグネットの作成・体験会誘導施策 （採択後） | ・見込み客獲得用レポートの作成（体験会への誘致） ・体験会案内容ニュースレターの作成（CV強化）（研修を提供する事業者の経営者・担当者向けの施策） | 2025年9月〜10月 |\n| セミナー・体験会・ オートウェビナー | ・原則、ライブ（リアル）のセミナーを開始 遠方の見込み客向けに ・録画型セミナーを構築し、24時間視聴可能に ・動画視聴後に個別相談・体験会へ誘導する仕組みを整備 | 2025年10月〜11月 |\n| 体験会の環境構築 | ・実際の導入場面をイメージできる体験会キットを整備・少人数制の個別体験・相談会の開催枠を設定 | 2025年11月〜12月 |\n| スケジューリングと実施体制の確立 | ・社内外パートナーと連携し、体験会・フォローの実施担当を明確化・見込法人への案内→申込→フォローの流れを整理 ・本格始動（本格始動前は、個別の対応で進める） | 2025年12月 |\n\n---","reviewPoint":"誰が、いつ、何を行うかを時系列で示し、目標達成までの実行可能性が分かる計画にする。"},{"id":"後半-9","phase":"後半","title":"1.補助事業で行う事業名（30文字以内で記入すること）","content":"**介護現場向け研修支援仕組み構築事業**","reviewPoint":"補助事業の対象、取組、得られる価値が伝わる名称にし、必ず30文字以内に収める。"},{"id":"後半-10","phase":"後半","title":"2-1.事業の概要","content":"本事業では、障がい福祉サービスや居住支援を手がけてきた当社が、10年にわたり蓄積してきた「現場起点の教育ノウハウ」と「即導入できる教育資産」を活用し、\\*\\*“研修商品そのものを社会に伝える仕組み（仕組みの仕組み）”\\*\\*の構築を図ります。特に、本事業では、移動支援従業者養成研修を通じた、研修メニューの法人向け製品の販路開拓を行います。\n\n採用しても定着しない、教える余裕がない、外国人スタッフとのコミュニケーションが難しい──こうした課題を抱える福祉・介護事業者に対し、当社自身が現場で運用してきた教育メソッドを、研修パッケージとして、通常個人向けに行われている研修を法人向けとして体系化し、各法人の研修メニューとして組み込める体制を構築します。**教育資産を「見える化」し、伝わる構造に整えることで、「知っている人だけのもの」に終わらせない普及体制**を整備します。","reviewPoint":"誰に、何を、どのように提供する取組かを冒頭で明確にし、既存事業との違いと販路開拓等への該当性が一読で分かるようにする。"},{"id":"後半-11","phase":"後半","title":"2-2.背景・目的","content":"当社は、障がい福祉の現場において10年以上にわたり、外国人・未経験者を含む多様な人材を採用・育成・定着させてきた実践ノウハウを蓄積してきました。その過程で構築された動画教材やマニュアル、OJT支援ツールといった教育資産は、実際の現場で効果を上げ、採用後の即戦力化・離職防止にも寄与しています。さらに、これらは社内で内製・運用されており、既に他法人への展開可能な状態にあります。\n\nしかしながら、当社のような現場密着型の中小企業においては、「価値あるノウハウや教育資産があっても、それを外部に伝える手段がない」という構造的な課題が存在しており、営業機能やマーケティング体制が未整備であることが、収益化の障壁となっています。特に、当社のような実践知ベースのサービスは、導入の「意義」や「成果」が見えにくく、顧客に対する訴求が難しいという特徴があります。\n\n一方で、介護・福祉業界では、人材不足が常態化し、教育・定着支援の需要が急速に高まっています。特に外国人スタッフや未経験者の受け入れに課題を抱える法人にとって、すぐに使える教育ツールとその活用支援は、極めてニーズが高い分野です。当社のもつ「即導入・即実践・成果が出る」教育資産は、この市場において競争優位性を有すると確信しています。\n\nそこで本事業では、こうした強みを活かしつつ、弱みを克服するために、当社の教育資産を軸に「体験・発信・相談」の一体型導入支援スキームを構築し、見込み顧客との接点づくりから商談化までの導線を明確化・仕組み化します。これにより、当社の教育資産が必要な法人に確実に届き、現場の人材課題解決に貢献できる体制を整備し、事業の持続的な成長と社会的使命の実現を目指してまいります。","reviewPoint":"前半で示した市場動向、顧客ニーズ、経営課題を受けて、なぜ今この補助事業を行うのかを因果関係が分かるように説明する。"},{"id":"後半-12","phase":"後半","title":"2-3.具体的な取組","content":"本事業では、「現場起点の教育ノウハウ」と「即導入できる研修」を有する当社が、それらを全国の福祉・介護事業所に伝えるための\\*\\*“体験・発信・相談”を組み合わせた支援スキーム\\*\\*を構築します。具体的には、当社が既に自社運用してきた教育コンテンツ・マニュアル・eラーニング等をベースに、体験会や録画セミナーを通じて現場のニーズに応える商談導線を整備します。\n\n【投資内容と必要理由】\n\n移動支援従業者養成研修を通じた、研修メニューの法人向け製品の販路開拓を行う。\n\n\n体験を重視し、介護福祉事業者の従業員向けの研修を武器にして、業界全体の教育の常識を変えることで、人材不足や、スキル不足による利用者への不満などをなくすと言った業界全体のレベルアップをここから始めることを目的に実施します。\n\n| 項目 | 投資内容 | 必要理由（解決できる課題） |\n| ----- | ----- | ----- |\n| **1\\. リードマグネット制作** | 区分：広報費 ・パンフレット型資料請求用小冊子（ホワイトペーパー）の制作 | 自社の教育研修パッケージは、既に実績があるが、外部に向けた「顧客視点の価値訴求資料」が整備されていない。専門家の支援で、関心を引く資料を整え、リード獲得の入口を創出する。 |\n| **2\\. 体験会・相談会への集客施策（オフライン）** | 区分：広報費 ・FAXDM、郵送DMの原稿・印刷・発送 | 介護・福祉事業者にはWebに不慣れな層も多く所在する。アナログ手段を併用することで、「知る機会の最初の一歩」となる認知と接点を強化し、Webに偏らないリード獲得と体験会への集客を実現する。 |\n| **3\\. 体験会・相談会への集客施策（オンライン）** | 区分：WEBサイト関連費 ・資料請求用LP（1本） ・デモ会告知用LP（1本） ・Google広告初期設定費 | リードを獲得し長期的にフォローしていくためには、オンラインの基盤整備が不可欠。LPを制作し、リタゲ広告などで接触頻度を高め、資料請求→体験会→商談という一連の動線を確保する。 |\n| **4\\. 体験会・説明会台本・スライド制作** | ・体験会台本制作 ・体験会スライド制作 ・体験会用レジュメ制作 | 社内で蓄積した現場ノウハウを、他法人向けに分かりやすく展開するための「伝える仕組み」の土台。参加者の理解を促進し、満足度・納得度を高めることで、成約率向上に直接つながる。 |\n| **5\\. 体験会実施スペースの確保** | ・改装 | 物置となっているスペースを改装し、リアルでの体験会スペース、商談スペースに変更し、、オンライン・リアルの商談をハイブリッドで行い、業務効率向上と、販路開拓の両面からの効果を促進する。 |\n\n---\n\n**【必要理由の詳細・実現可能性を高めるための工夫】**\n\n必要理由の詳細・実現可能性を高めるための工夫点を下記にまとめました\n\n****\n\n****\n\n### 全体の工夫点、実現可能性を高める工夫\n\n当社では、本事業に魁、同業他社だけでなく、オンライン・オフラインを融合させた研修パッケージを販売する会社の販路開拓を徹底的に調べた。その結果、以下の点で、うまく行っている会社と、そうでない会社の違いを把握することができた。\n\n| 観点 | うまく行っている会社 | うまく行っていない会社 |\n| :---- | :---- | :---- |\n| **導入フェーズの考え方** | 研修は“手段”であり、法人課題を解決するための“変化プロセス”として提示 | 研修は“商品”であり、講座の中身や魅力を“情報として説明” |\n| **接点の立ち上げ** | まず“現場の痛み”に触れる体験や診断（例：新人が定着しない／外国人対応） | 研修の構成、講師プロフィール、資格取得のメリットを列挙 |\n| **説明の順番** | 現場負担→業務停滞→教育不足→研修導入の「因果」を段階化 | 研修の魅力→時間→カリキュラム→受講者の口コミ の順で並べる |\n| **メッセージ軸** | 「研修後の現場がどう変わるか」を中心に語る | 「研修そのものがどれだけ優れているか」を中心に語る |\n| **導線** | 体験・診断 → 課題共有 → 解決策としての研修 → 現場導入サポート | LP → 問い合わせ → 研修内容の説明 → 受講希望の確認 |\n| **理解段階への適応** | 経営者の理解→中間管理層の実務→現場スタッフの運用と“認知層ごとに分解” | すべての層に一律の説明（「こんな研修です」「いいですよ」） |\n| **意思決定の支援** | 「今いる人材が変わる」「受入体制が整う」など法人単位のベネフィット提示 | 「受講すればスキルが上がる」「資格が取れる」と個人視点の価値 |\n| **提案の最終形** | 研修を“組織の仕組みに取り込む”設計（例：新人導入プロセス、OJT） | 研修は“単発イベント”。受け終われば関係終了 |\n\n**コレらを反映した具体的な、実現性を高める要素は以下のとおりです。**\n\n**1\\. 体験会誘導を効率化するリードマグネット制作　**  \n****  \n**2\\. 集客施策（オフライン）**  \n  \n**3\\. ランディングページ制作（Web関連）**  \n****\n\n**4.体験会・説明会台本・スライド制作**  \n****\n\n**5\\. ニュースレターによるリードナーチャリング**  \n****\n\n### **【実施体制】**\n\n### **1\\. 責任者体制**\n\n本事業の統括責任者は、代表取締役 向井玄人が担い、事業全体の戦略策定・資金管理・行政連携・対外交渉を統括します。現場実務は営業責任者 小林良介（仮名）が兼任し、営業企画・法人提案・導入支援・研修設計を担当。SNSや動画、教材コンテンツの制作・運用に関しては、**事業実施時に代表が適任者を指名し、社内外スタッフと連携して運用改善を継続**していく体制とします。\n\n### **2\\. 人員体制**\n\n初年度は既存社員（営業・制作・事務）3名体制にて運営し、動画制作・SNS運用を担当する外注スタッフ1名を契約。事業の進捗に応じて2年目以降、営業職・研修支援職を各1名ずつ増員予定。最大7名体制で、法人研修導入・教育定着まで一貫支援が可能な人員配置とします。\n\n### **3\\. スケジュール**\n\n交付決定から1ヶ月以内に全体設計・コンテンツ整備を行い、2ヶ月目に営業資料作成と法人提案を開始。3ヶ月目にトライアル提供→4ヶ月目に正式提供・広報開始→6ヶ月目以降は法人拡大とSNS活用によるマーケティングを推進。12ヶ月目に効果検証を実施し、次年度の採用・営業計画へ移行します。\n\n### **4\\. 資金調達計画**\n\n初期費用は自己資金3,000千円を充当し、すでに確保済。補助対象外費用も全額自己負担とし、借入は行いません。立ち上げ初期の運転資金（人件費・固定費）も事前準備済みで、2年目以降の黒字化を見込んでいます。補助事業終了後も自走可能な収益構造を設計しています。\n\n---","reviewPoint":"導入・制作・改修・広報等の取組を項目別に分け、内容、仕様、対象、実施方法、担当、時期、費用との対応、実現可能性を具体化する。"},{"id":"後半-13","phase":"後半","title":"4-1.取組の効果","content":"---\n\n◆定性的な効果\n\n今後期待できる効果、実現する効果は以下のとおりです。\n\n**効果1：売上拡大による収益基盤の強化**\n\n本事業により、「現場起点の教育ノウハウ」と「即導入できる教育資産」を体系化・商品化し、既存の福祉法人等への外販が可能になります。これにより、障がい福祉報酬に依存していた売上構造から、B2B研修事業による収益化が進み、全社的な売上拡大が期待されます。また、社内で既に実績のある動画教材やマニュアルを転用することで、原価を抑えた提供が可能となり、営業利益率の改善にも寄与します。\n\n**効果2：地域経済への波及と経済循環の促進**\n\n本事業では、制作物や営業資材の一部を地域の業者へ外注する計画があり、地域の印刷会社や制作業者との連携が見込まれています。さらに、福祉・介護法人との接点強化を通じて、地域の雇用支援・人材育成の仕組みが整備されることで、間接的に地域経済への好循環を生み出すことが期待されます。また、地域密着型の営業活動（FAXDM、郵送DMなど）により、商圏内での認知度向上と事業拡大が図られます。\n\n**効果3：新たな雇用創出と人材活用の促進**\n\n事業の成長に伴い、営業職・研修支援職を中心に人員を増員する計画となっており、初年度3名体制から最大7名体制への拡大を見込んでいます。これにより、福祉業界における人材の流動性に対応しつつ、若年層や子育て世代など、多様な人材の雇用機会創出が可能となります。特に動画制作・SNS運用などは副業人材や外注も視野に入れており、柔軟な働き方を提供することで、雇用の多様化にも寄与します。\n\n**効果4：賃金水準の改善と労働環境の向上**\n\n収益性の高い新規事業の展開により、企業としての利益体質が改善されれば、従業員への報酬や労働環境の向上にもつながります。具体的には、基本給の引き上げ、賞与支給の強化、動画等による業務効率化による残業時間の削減などが見込まれます。また、営業活動・提案活動が標準化されることで、属人性を排し、働きやすい体制が整備され、定着率の向上にもつながります。","reviewPoint":"補助事業が新規顧客、売上、利益、生産性、地域への波及にどう結びつくかを、取組から効果までの因果関係で説明する。"},{"id":"後半-14","phase":"後半","title":"4-2.効果の試算","content":"【本事業の取組の試算】\n\n| 年度 | 資料請求数（件） | 体験会（件） | 商談化（件） | 成約（件） | 売上（千円） |\n| （補助金適正化法）に基づき実施さ\n  れます。補助金の不正受給が行われた場合には、補助金交付決定の取消・返還命令、不正の内容の公\n  表等や、5 年以下の拘禁刑もしくは 100 万円以下の罰金に処せられ、又はこれを併科されることがあり\n  ます。\n○ 補助金を不正に受給した疑いがある場合には、補助金事務局等として、補助金の受給者に対し必要に応\n  じて現地調査等を実施します。\n  https://official.jizokukanb.com/furankisei/\n○ 事業に係る取引先（委託先、外注（請負）先以降を含む）に対して、不明瞭な点が確認された場合、補助\n  金の受給者立ち会いのもとに必要に応じ現地調査等を実施します。その際、補助金の受給者から取引先\n  に対して協力をお願いしていただくこととします。\n○ 申請書類において、以下を宣誓いただきます。\n  ①虚偽の申請による不正受給、②補助金の目的外利用、③「補助金受給額を不当に釣り上げ、関係者へ\n  報酬を配賦する」といった不正な行為に加担していないこと及び今後も加担しないこと。\n  宣誓に違反した場合は、「小規模事業者持続化補助金＜一般型 通常枠＞交付規程」（以下、「交付規\n  程」という。）に基づき交付決定取消となるだけでなく、補助金交付済みの場合、加算金を課した上で当\n  該補助金の返還を求めます。\n○ 本公募要領と併せて、後日公開する別紙「参考資料」、「申請時によくあるご質問」を必ず確認の上、応募\n  してください。\n○ 小規模事業者持続化補助金＜創業型＞との重複申請はできません。\n○ 本公募要領については、必要に応じて改定されることがあります。申請時には最新の補助金事務局ホー\n  ムページからご確認ください。\n  商工会地区：https://official.jizokukanb.com/\n  商工会議所地区：https://r6.jizokukahojokin.info/\n\n※商工会地区の補助金事務局等：株式会社ニューズベース、全国商工会連合会、各地商工会\n※商工会議所地区の補助金事務局等：株式会社日本経営データ・センター、日本商工会議所、各地商工会議所\n\n\n\n\n                                        1\n\n\n--- ページ区切り ---\n\n                                 目次\n\n\n\n事業概要・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・      P.3\n\n1．事業の目的・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・       P.4\n\n2．補助対象者・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・       P.4\n\n3．補助対象外となる事業者・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・            P.5\n\n4．補助対象事業・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・        P.6\n\n5．補助対象外となる事業・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・           P.7\n\n6．補助率、補助上限額等・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・           P.7\n\n7．補助対象経費・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・       P.11\n\n8．申請手続・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・     P.22\n\n9．補助事業実施期間等・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・          P.24\n\n10．補助事業者の義務（採択後に遵守すべき事項）・・・・・・・・・・・・・・・・・・・                   P.24\n\n11．申請に必要な書類・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・        P.26\n\n12.採択審査・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・    P.32\n\n13.その他・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・・   P.41\n\n\n\n\n                                  2\n\n\n--- ページ区切り ---\n\n｜ 事業概要 ｜\n 小規模事業者および一定要件を満たす特定非営利活動法人（以下「小規模事業者等」という。）が今後複数\n年にわたり相次いで直面する制度変更等に対応するために取り組む販路開拓等の取組の経費の一部を補助\nすることにより、地域の雇用や産業を支える小規模事業者等の生産性向上と持続的発展を図ることを目的と\nします。本補助金事業は、自ら策定した持続的な経営に向けた経営計画に基づく販路開拓等の取組や、その\n取組と併せて行う業務効率化（生産性向上）の取組を支援するため、それに要する経費の一部を補助するも\nのです。\n○補助上限：50 万円\n    ※上記金額に、インボイス特例対象事業者は 50 万円の上乗せ、賃金引上げ特例対象事業者は 150 万円の上\n     乗せ、両特例対象事業者は 200 万円の上乗せ（詳細は P.7 をご参照ください）。\n○補 助 率：2／3（賃金引上げ特例のうち赤字事業者は 3／4）\n○対象経費：機械装置等費、広報費、ウェブサイト関連費、展示会等出展費（オンラインによる展示会・商談会\n      等を含む）、旅費、新商品開発費、借料、委託・外注費\n○公募期間：公募要領公開：2026 年 5 月 27 日（水）\n      申請受付開始：2026 年 11 月 5 日（木）\n      申請受付締切：2026 年 12 月１５日（火）17：00 ※予定は変更する場合があります。\n      事業支援計画書（様式 4）発行の受付締切：2026 年 12 月 4 日（金）\n     ※ 事業支援計画書（様式 4）について、受付締切以降の発行依頼は、いかなる理由があっても\n         できません。また、補助対象者の要件を満たしていないと判断される場合も発行はできませ\n         ん。\n   ＜今後の公募予定＞\n    第 20 回公募申請受付締切以降に追ってご案内します。\n○申請方法：申請は、電子申請システムでのみ受け付けます。郵送での申請は一切受け付けません。\n○補助事業の流れ：赤色の項目は補助事業者が実施し、白色の項目は補助金事務局が実施します。\n                                   ▶G ビズ ID プライムのアカウントを取得します。\n      ＧビズＩＤプライムのアカウントを取得\n                                    https://gbiz-id.go.jp/top/\n\n         事業計画（様式 2）を策定\n\n                                   ▶地域の商工会・商工会議所から事業支援計画書の発行\n 商工会・商工会議所へ事業支援計画書(様式４)の発行依頼       を受けます。【発行受付締切：２０２6 年 12 月 4 日】\n\n                                   ▶申請書類を提出します。\n           申請書類の提出                 【申請受付締切：２０２6 年 12 月 15 日 17:00】\n                                   ▶審査の結果、採択が決定されると補助金事務局から\n                                   「採択通知書」が送付されます。\n              採択\n                                   【採択発表予定日：２０２7 年 3 月頃予定】\n                                   ※申請数等により予定は変更する場合があります。\n                                   ▶入手価格の妥当性を証明できる見積書等を提出します。\n           見積書等の提出                 【提出期限：2028 年 2 月 29 日】（注 1）\n                                   ▶審査の結果、補助金事務局から「交付決定通知書」が送\n             交付決定                  付されます。交付決定通知書に記載の交付決定日（注 2）\n                                   から補助事業を開始できます。\n                                   ▶補助事業の終了後、実績報告書および経理書類を提\n           実績報告書の提出                出します。\n\n           補助金額の確定\n\n\n            補助金の請求\n\n\n            補助金の交付\n\n                                      ▶補助事業の終了後から１年後の状況について、報告書\n         事業効果報告書の提出                   を提出します。\n（注 1）見積書等の提出期限(2028 年 2 月 29 日)までに見積書等の提出がなされていない場合は、採択取消しとします。\n（注 2）交付決定には、採択後、詳細な見積書が速やかに提出された場合でも、採択発表から概ね 1〜2 か月かかる場合があり\n   ます。（あくまで目安であり、状況により変動しますのでご注意ください。）\n\n\n\n                               3\n\n\n--- ページ区切り ---\n\n1．事業の目的\n\n 小規模事業者等が今後複数年にわたり相次いで直面する制度変更（物価高騰、賃上げ、インボイス制度\nの導入等）等に対応するため、小規模事業者等が取り組む販路開拓等の取組の経費の一部を補助すること\nにより、地域の雇用や産業を支える小規模事業者等の生産性向上と持続的発展を図ることを目的とします。\n 本補助金事業は、小規模事業者等が自ら策定した持続的な経営に向けた経営計画に基づく、販路開拓等\nの取組（例：新たな市場への参入に向けた売り方の工夫や新たな顧客層の獲得に向けた商品の改良・開発\n等）や、販路開拓等と併せて行う業務効率化（生産性向上）の取組を支援するため、それに要する経費の一\n部を補助するものです。\n\n\n2．補助対象者\n\n 本補助金の補助対象者は、（1）から（3）に掲げる要件をいずれも満たす日本国内に所在する小規模事業\n者（日本国内に居住する個人、又は日本国内に本店を有する法人）等であることとします。\n\n（1）小規模事業者であること\n 「商工会及び商工会議所による小規模事業者の支援に関する法律」において、業種ごとに従業員数で小\n 規模事業者であるか否かを判断しています。\n 商業・サービス業（宿泊業・娯楽業除く）      常時使用する従業員の数   5 人以下\n サービス業のうち宿泊業・娯楽業          常時使用する従業員の数 20 人以下\n 製造業その他                   常時使用する従業員の数 20 人以下\n ※業種の判定については、現に行っている事業の業態、または今後予定している業態によって判定します。\n  業種の考え方については、後日公開する別紙「参考資料」をご参照ください。\n ※補助対象者は事業終了まで小規模事業者であることが必要です（小規模事業者卒業加点を希望する\n  事業者除く）。\n ※「常時使用する従業員の数」は申請時において常時使用する従業員の数で判断ください。具体的には、\n  「中小企業基本法」（昭和 38 年法律第 154 号）上の常時使用する従業員をいい、「労働基準法」\n  （昭和 22 年法律 第 49 号）第 20 条の規定に基づく「解雇の予告を必要とする者」をいいます。こ\n  れには日雇労働者、２か月以内の期間を定めて使用される者、季節的業務に 4 か月以内の期間を定め\n  て使用される者、試用期間中の者は含まれません。また会社役員や同居の親族従業員は含まれません。\n ※賃上げ特例及び賃上げ加点を活用される場合の従業員の考え方とは異なることにご注意ください。\n  詳細は P.9 を参照ください。\n 補助対象者の範囲\n          補助対象となりうる者              補助対象にならない者\n  ○会社および会社に準ずる営利法人        ○医師、歯科医師、助産師\n   （株式会社、合名会社、合資会社、合同会    ○系統出荷による収入のみである個人農業者（個人\n   社、特例有限会社、企業組合・協業組合、士    の林業・水産業者についても同様）（※2）\n   業法人（弁護士・税理士等））         ○協同組合等の組合（企業組合・協業組合を除く）\n  ○個人事業主（商工業者であること）       ○一般社団法人、公益社団法人\n  ○一定の要件を満たした特定非営利活動法人    ○一般財団法人、公益財団法人\n   （※1）                   ○医療法人\n                          ○宗教法人\n                          ○学校法人\n                          ○農事組合法人\n                          ○社会福祉法人\n\n\n                          4\n\n\n--- ページ区切り ---\n\n                           ○申請時点で開業していない創業予定者（例えば、\n                            既に税務署に開業届を提出していても、開業届上\n                            の開業日が申請日よりも後の場合は対象外）（※\n                            3）\n                           ○任意団体 等\n\n\n ※1：特定非営利活動法人は、以下（ア）（イ）の要件を満たす場合に限り、補助対象となり得ます。なお、\n    同要件を満たす特定非営利活動法人の「常時使用する従業員の数」の適用業種は「その他」として、\n    「製造業その他」の従業員基準（20 人以下）を用います。\n   (ア) 法人税法上の収益事業（法人税法施行令第 5 条に規定される 34 事業）を行っていること。なお、\n       収益事業を行っていても、免税されていて確定申告書の提出ができない場合は補助対象外です。\n   (イ) 認定特定非営利活動法人でないこと。\n\n ※2：個人農業者（林業・水産業者も同様）であっても、農作物の加工や農作物を用いた料理の提供等を\n    行う事業については、その加工や料理の提供等に必要な経費は、補助対象となります。（農作物の\n    生産自体に必要な経費は、補助対象外です）。\n\n ※3：既に税務署に開業届を提出していても、申請時点までに事業を開始していない場合も補助対象外\n    となります。採択後に判明した場合は、採択・交付決定の取消し等を行う場合があります。\n\n（2）資本金又は出資金が 5 億円以上の法人に直接又は間接（※）に 100％の株式を保有されていないこと\n   （法人のみ）\n  ※「間接に 100％の株式を保有」とは、補助対象者の株式を直接に保有する者（A 社）の資本金は 5 億\n   円以上ではないものの、A 社の株式を直接に保有する者（B 社）の資本金が 5 億円以上の場合で、\n   以下のような事例が該当する。\n\n\n\n\n（3）確定している（申告済みの）直近過去 3 年分の「各年」又は「各事業年度」の課税所得の年平均額が 15\n   億円を超えていないこと\n  ※上記への該当の有無を確認するため、必要がある場合には、納税証明書等の提出を求めることがあ\n  ります。\n\n\n3．補助対象外となる事業者\n\n 下記に該当する事業者は、補助対象外となります。また、該当することが判明した時点で補助対象外とな\nります。事前に十分確認してください。\n\n（1）下記 4 つの事業において、採択を受けて、補助事業を実施した場合、各事業の交付規程で定める様式\n   第 14「小規模事業者持続化補助金に係る事業効果および賃金引上げ等状況報告書」が未提出である\n   事業者 (先行する受付締切回で採択された共同申請の参画事業者を含む)\n\n\n\n                          5\n\n\n--- ページ区切り ---\n\n   ①「小規模事業者持続化補助金＜一般型 通常枠＞」\n    ※第 1 回～第 16 回「小規模事業者持続化補助金＜一般型＞」を含む。\n   ②「小規模事業者持続化補助金＜コロナ特別対応型＞」\n   ③「小規模事業者持続化補助金＜低感染リスク型ビジネス枠＞」\n   ④「小規模事業者持続化補助金＜創業型＞」\n  ※申請する公募回の申請受付締切までに、補助金事務局から指摘のあった不備が解消している必要\n    があります。\n  ※過去に上記①②③④の公募回に採択され補助事業を実施した事業者は、事業実施期間終了日の属\n   する月の翌月から１年間が経過し、「小規模事業者持続化補助金に係る事業効果および賃金引上げ\n   等状況報告書」の提出を完了している場合に、申請が可能です。\n  ※本補助金を申請するにあたっては、必ず過去に上記 4 つの事業において採択・補助金の交付を受け\n   たのち、様式第 14 を提出しているかを確認してください。代表者等が変更になった場合も「過去の補\n   助事業者である」に該当します。\n  ※過去に上記①②③④の「補助事業者である場合」、過去回の事業内容・実績を確認するために、必要\n    に応じて、該当回の実績報告書（様式第 8）の写しの提出を求めることがあります。\n  ※なお、「小規模事業者持続化補助金＜一般型 通常枠＞第 20 回公募」において、採択され補助事業\n    を実施する事業者は、事業実施期間終了日の属する月の翌月から１年間が経過し、「小規模事業者\n    持続化補助金に係る事業効果および賃金引上げ等状況報告書」の提出を完了後、さらに１年が経過\n    してから再度の申請が可能です。\n\n\n\n（2）小規模事業者持続化補助金＜一般型＞において、「卒業枠」で採択を受けて、補助事業を実施した事\n   業者。\n\n（3）小規模事業者持続化補助金＜一般型 通常枠＞において、「小規模事業者卒業加点」で採択を受けて、\n   補助事業を実施した事業者\n\n（4）小規模事業者持続化補助金＜創業型＞に申請中または採択を受けている事業者。 ※小規模事業者\n   持続化補助金＜創業型＞と同時に申請できません。\n\n\n4．補助対象事業\n\n 補助対象となる事業は、次の（1）から（４）に掲げる要件をいずれも満たす事業であることとします。\n\n（1）策定した「経営計画」に基づいて実施する、販路開拓等のための取組であること。あるいは、販路開拓等\n   の取組とあわせて行う業務効率化（生産性向上）のための取組であること\n  販路開拓のための取組及び業務効率化（生産性向上）のための取組についての具体的な取組事例等\n  は、後日公開する別紙「参考資料」を参照してください。\n\n（2）商工会・商工会議所の支援を受けながら取り組む事業であること\n  「商工会・商工会議所の支援を受けながら取り組む」とは、商工会・商工会議所による事業支援計画書\n  （様式 4）の発行及び補助事業実施における助言等の支援を受けながら事業を実施することです。\n  ※事業支援計画書（様式 4）を発行するにあたり、基本情報入力画面に記載の代表者に計画（様式 2，\n   3）等の内容について、直接確認する場合があります。\n\n\n\n                         6\n\n\n--- ページ区切り ---\n\n ※事業支援計画書（様式 4）について、受付締切以降の発行依頼は、いかなる理由があってもできませ\n  ん。また、補助対象者の要件を満たしていないと判断される場合も発行はできません。\n\n（3）補助事業実施期間内に補助事業が終了すること\n   補助金のお支払いをするためには、補助事業実施期間内に終了する補助事業であることが必要です。\n   （補助事業実施期間：交付決定日から事業実施期限（2028 年 3 月 31 日（金）まで）\n   ※交付決定には、採択後、詳細な見積書等が速やかに提出された場合でも、採択発表から概ね 1〜2\n    か月かかる場合があります。（あくまで目安であり、状況により変動しますのでご注意ください。）\n\n（４）事業効果および賃金引上げ等状況報告書提出時の売上高・売上総利益が補助事業終了時と比較し増\n   加することが見込める事業であること\n  申請時には、客観的なデータを用いた市場や顧客ニーズの分析、営業方針、新規取引や値上げの見込み\n  などの根拠や説明とともに、取り組む補助事業における定量的な成果（売上高・売上総利益の増加）を補\n  助事業計画（様式 2）に記載していただく必要があります。\n\n\n5．補助対象外となる事業\n\n 以下に該当する事業は補助対象外とします。該当するとされた場合は不採択、採択決定の取消又は交\n付決定の取消を行います。\n\n\n ○国が助成（国以外の機関が、国から受けた補助金等により実施する場合を含む）する他の制度（補助金、\n  委託費、公的医療保険・介護保険からの診療報酬・介護報酬、固定価格買取制度等）と同一又は類似\n  内容の事業\n  例）デイサービス・介護タクシー等の居宅介護サービス事業者で介護報酬が適用されるサービス、\n    薬局・整骨院等の保険診療報酬が適用されるサービス\n  ※持続化補助金では、同一の補助事業（取組）について、重複して国の他の補助金を受け取ることはで\n   きません。他の補助金を受給しているか受給予定の方は、補助金を受け取ることが可能か、必ず、双\n   方の補助金事務局等に、あらかじめご確認ください。\n ○本事業の終了後、概ね 1 年以内に売上げにつながることが見込まれない事業\n  例)機械を導入して試作品開発を行うのみであり、本事業の取組が直接販売の見込みにつながらない、\n    想定されていない事業\n ○事業内容が射幸心をそそるおそれがあること、または公の秩序もしくは善良の風俗を害することとなる\n  おそれがあるもの、公的な支援を行うことが適当でないと認められるもの\n  例）マージャン店・パチンコ店・ゲームセンター店等、性風俗関連特殊営業等\n\n\n6．補助率、補助上限額等\n\n（1）補助率、補助上限額\n\n     補助率          2／3（賃金引上げ特例のうち赤字事業者は 3／4）\n\n\n    補助上限                    50 万円\n\n\n\n\n                        7\n\n\n--- ページ区切り ---\n\n                            50 万円上乗せ※\n   インボイス特例\n                  ※インボイス特例の要件（P.8 参照）を満たしている場合に限る\n\n                            150 万円上乗せ※\n   賃金引上げ特例\n                  ※賃金引上げ特例の要件（P.9 参照）を満たしている場合に限る\n\n   上記特例の要件を                  200 万円上乗せ※\n  ともに満たす事業者          ※両特例要件（P.11 参照）を満たしている場合に限る\n ※ 補助事業終了時点で一定要件を満たす必要があり、満たさない場合、補助金交付は行いません。\n\n（2）インボイス特例の適用要件について\n           免税事業者が適格請求書発行事業者への転換に伴う事業環境変化に対応すること\n           に対し政策支援をするため、2021 年 9 月 30 日から 2023 年 9 月 30 日の属する\n    概要     課税期間で一度でも免税事業者であった事業者、または 2023 年 10 月 1 日以降に\n           創業した事業者のうち、適格請求書発行事業者の登録を受けた事業者に対して、補\n           助上限額を一律 50 万円上乗せします。\n           補助事業の終了時点で「適格請求書発行事業者」の登録を受け、かつ、以下①②の\n           いずれかに当てはまる事業者\n           ① 2021 年 9 月 30 日から 2023 年 9 月 30 日の属する課税期間で一度でも免\n              税事業者であった事業者\n           ② 2023 年 10 月 1 日以降に創業した事業者\n           ただし、補助事業の終了時点でこの要件を満たさない場合、補助金は交付されませ\n           ん。\n    要件      （注）小規模事業者持続化補助金＜一般型 通常枠＞において「インボイス特例」を\n               活用して補助事業を実施した事業者、または小規模事業者持続化補助金＜一\n               般型＞において「インボイス枠」（「インボイス特例」を含む）で採択を受けて補\n               助事業を実施した事業者は、本特例の申請対象外です。\n            （注）インボイス特例を希望した場合、通常枠およびインボイス特例の要件を 1 つで\n               も満たさない場合は、補助金は交付されません（特例による上乗せ部分のみで\n               はなく全体が交付対象外となります）。\n\n\n           ＜申請時＞\n            ○電子申請システムの申請情報入力画面における「インボイス特例の希望」にて、\n             該当欄へチェックしてください。\n            ○応募者概要入力（様式 2）画面に下記の課税売上高を入力してください。\n             ① 2019 年 9 月 30 日の属する事業年度の課税売上高\n             ② 2020 年 9 月 30 日の属する事業年度の課税売上高\n   必要な手続     ③ 2021 年 9 月 30 日の属する事業年度の課税売上高\n            ○宣誓・同意画面に表示される「インボイス特例の申請に係る宣誓・同意書」（様式\n             9）を確認し、該当箇所にチェックをしてください。\n            ○以下のいずれかがある場合は、書類を提出してください。\n             ＜登録済みの事業者＞\n               ・適格請求書発行事業者の登録通知書の写し\n              ＜電子申告（e-Tax）で登録申請手続中の事業者＞\n\n\n\n                             8\n\n\n--- ページ区切り ---\n\n             ・登録申請データの「受信通知」画面の写し\n            ※「郵送（紙）で登録申請手続中の事業者」・「登録申請がまだの事業者」は、申\n             請時は提出不要。\n\n         ＜実績報告時＞\n          申請時に適格請求書発行事業者の登録通知書の写しを提出していない事業者\n          は、適格請求書発行事業者の登録通知書の写しを提出。\n          ※適格請求書発行事業者の登録申請手続については、以下の国税庁 HP をご参照く\n           ださい。\n           https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keige\n           nzeiritsu/invoice_shinsei.htm\n\n\n（3）賃金引上げ特例の適用要件について\n         最低賃金の引上げが行われる中、それに加えて更なる賃上げを行い、従業員に成長\n         の果実を分配する意欲的な小規模事業者に対し政策支援をするため、2027 年 4 月\n         1 日から補助事業実施期限日（2028 年 3 月 31 日（金））までの期間と前年同月の１\n         ２か月を比べ、従業員（非常勤を含む。代表者、役員及び専従者は含めない。以下同\n         じ。）1 人あたり給与支給総額が年平均 3.0％以上増加した事業者に対して支援しま\n    概要\n         す。\n         加えて、賃金引上げ特例に申請する事業者のうち業績が赤字の事業者については、\n         補助上限引上げに加えて、補助率が２／３から３／４へ引き上がる（インボイス特例対\n         象事業者は、インボイス特例による上乗せ部分も含む）と共に、赤字賃上げ加点が適\n         用されるため、優先採択を実施します。\n         補助事業終了予定日は補助事業実施期限日（2028 年 3 月 31 日（金））に設定して\n         ください。\n         補助事業実施期限日を終点とした連続する１２か月とその前年同月の１２か月を比較\n         し、従業員 1 人あたり給与支給総額を 3.0％以上増加させること。\n         具体的には、申請者自身で１人あたりの給与支給総額を 3.0％以上引き上げる目標\n         値（以下「１人あたり給与支給総額目標値」という。）を設定し（※1）、採択後交付決定\n         までに全ての従業員又は従業員代表者、役員に対して表明のうえ（※2）、実績報告時\n         点において１人あたり給与支給総額目標値を達成することが必要です。\n         ※1：1 人あたり給与支給総額の算出に含める従業員は、賃金引上げの比較対象期間\n          である「補助事業実施期限日を終点とした連続する 12 か月」および「その前年同月\n    要件\n          の１２か月」の各期間にて、全月分の給与等の支給を受けた従業員とします。中途採\n          用や退職等により、いずれかの期間において全月分の給与等の支給を受けていな\n          い従業員は、当該期間の算出対象から除外します。各時点において、産前・産後休\n          業、育児休業、介護休業など事業者の福利厚生等により時短勤務を行っている従\n          業員は算出対象から除くことができます。なお、パートタイム従業員については、正\n          社員の就業時間に換算して人数を算出してください。 昇給や減給、残業時間等の\n          増減等により給与変動がある従業員も１人あたり給与支給総額の年平均上昇率の\n          算出対象となります。あらかじめこれらの要因も考慮したうえで算出してください。\n         ※2：表明方法については、採択発表時に公開される「補助事業の手引き」にてご案内\n          します。\n\n\n                                9\n\n\n--- ページ区切り ---\n\n        （注）年平均とは連続する１２か月の平均のことを指します。\n        （注）パートタイム従業員は正社員の就業時間に換算した人数となりますので、例え\n           ば、正社員の就業時間が 1 日 7 時間・週 35 時間の事業者において 1 日 3 時\n           間・週 15 時間勤務のパートタイム従業員は、0.42 人（3÷7 の小数点以下第 3\n           位を切捨て）として計算します。\n        （注）給与支給総額とは、従業員に支払った給与等（給料、賃金、残業代、賞与等は含\n           み、福利厚生費や法定福利費、退職金は除く）をいいます。また、1 人あたり給与\n           支給総額とは、給与支給総額を従業員数で除したものをいいます。詳しくは、後\n           日公開する別紙「参考資料」を参照してください。\n        （注）賃金引上げ特例を希望した場合、賃上げ加点が自動的に適用されます。\n        （注）本特例における「従業員」は、申請要件である「常時使用する従業員」とは異なり\n           ます。\n        （注）賃金引上げの比較対象期間（補助事業実施期限日を終点とする１２か月および\n           その前年同月の 12 か月）の各期間にて、いずれかの月で算定対象となる従業員\n           が存在しない場合は、1 人あたり給与支給総額を算出できないため、本特例の対\n           象外となります。\n        （注）申請時点では要件を満たしている場合であっても、実績報告時までに従業員が\n           退職する等により、1 人あたり給与支給総額の年平均上昇率を算出できなくなっ\n           た場合は、補助金は交付されません。\n        （注）補助事業実施期限日を終点とした連続する１２か月とその前年同月の 12 か月に\n           おいて、支給している事業場内最低賃金が、地域別最低賃金以上である必要が\n           あります。\n        （注）賃金引上げ特例を希望した場合、通常枠および賃金引上げ特例の要件を１つで\n           も満たさない場合は、補助金は交付されません（特例による上乗せ部分のみでは\n           なく全体が交付対象外となります）。\n        ＜申請時＞\n         ○電子申請システムの申請情報入力画面における「賃金引上げ特例の希望」にて、\n          賃金引上げ特例（補助上限に 150 万円上乗せ）を選択してください。\n         ○宣誓・同意画面に表示される「賃金引上げ特例・賃金引上げ加点の申請に係る誓\n          約・同意書（様式 7）」を確認し、該当箇所にチェックをしてください。\n        ＜採択後交付決定まで＞\n         ○「給与支給総額基準値算出表」画面にて、1 人あたり給与支給総額基準値の算定\n          に必要な情報（給与支給総額、従業員数等）を入力し、1 人あたり給与支給総額\n必要な手続     目標値を設定し、賃金引き上げ計画の表明書を確認のうえ該当箇所にチェック\n          をしてください。\n         ○以下の書類を提出してください。\n           ✓ 労働基準法に基づく、採択発表日の属する月を終点とした連続する１２か月\n             分の賃金台帳（※1）の写し（※2）。\n           ✓ 雇用条件（1 日の所定労働時間、年間休日）が記載された書類の写し（※\n             2）。 例）雇用契約書、労働条件通知書等\n        ＜実績報告時＞\n         ○以下の書類を提出してください。\n\n\n                         10\n\n\n--- ページ区切り ---\n\n               ✓   補助事業実施期限日を終点とした連続する１２か月分の、労働基準法に基\n                   づく賃金台帳（※1）の写し（※2）。\n               ✓   賃金引上げ後の雇用条件（1 日の所定労働時間、年間休日）が記載された\n                   書類の写し（※2）。 例）雇用契約書、労働条件通知書等\n            ※1：労働基準法に基づく賃金台帳は、後日公開する別紙「参考資料」を参照してくだ\n               さい。\n            ※2：役員、専従者従業員を除く、補助事業実施場所の全従業員分の提出が必要で\n               す。\n\n   業績が赤字の事業者に対する追加要件（補助率 3／4 を適用）\n            「賃金引上げ特例」に取り組む事業者のうち、直近 1 期または直近 1 年間の課税所得\n            金額※がゼロ以下である事業者。\n            ※課税所得金額は以下のことを指します。\n            ＜法人の場合＞\n              直近 1 期分の法人税申告書の別表一・別表四「所得金額又は欠損金額」欄の金額。\n    追加要件    ＜個人事業主の場合＞\n             直近 1 年間の「所得税および復興特別所得税」の「確定申告書」第一表の「課税され\n             る所得金額」欄の金額。\n\n            （注）賃金引上げ特例（赤字事業者）を希望した場合、賃金引上げ加点に加え、赤字賃\n               上げ加点も自動的に適用されます。\n\n            上記「賃金引上げ特例」において必要な手続に追加して、申請時に以下の手続が必要\n            です。\n            ○電子申請システムの申請情報入力画面における「希望する特例の選択」にて、賃\n             金引上げ特例（赤字事業者）を選択してください。\n        ✓   ＜法人の場合＞\n     必要な\n             以下の書類を提出してください。\n    追加手続\n               ✓ 直近 1 期に税務署へ提出した、法人税申告書の別表一・別表四の写し。\n       ✓    ＜個人事業主の場合＞\n             以下の書類を提出してください。\n               ✓ 直近 1 年に税務署へ提出した、「所得税および復興特別所得税」の「確定\n                 申告書」第一表の写し。\n\n\n（4）インボイスおよび賃金引上げの両特例の適用を受ける場合、上記（2）および（3）の両方の要件（含む追\n  加要件）を満たし、必要な手続き（含む追加手続き）を行うことが必要です。\n  インボイス特例および賃金引上げ特例を希望した場合、通常枠・インボイス特例・賃金引上げ特例の要件\n  を 1 つでも満たさない場合は、補助金は交付されません（特例による上乗せ部分のみではなく全体が交付\n  対象外となります）。\n\n\n7．補助対象経費\n\n（1）補助対象となる経費は、策定した「経営計画」に基づいて実施するもので（3）に掲げる経費であり、これ\n  以外の経費は本事業の補助対象外です。また、補助金の額は、補助対象経費の合計額に補助率を乗じ\n  て得た額の合計額となります。\n\n\n                            11\n\n\n--- ページ区切り ---\n\n採択発表後交付決定までに、経費の価格の妥当性を証明できる見積書等（相見積含む）の提出が必要\nです。支出内容が不明確なものは認められません。見積金額に複数の項目が含まれる場合は、その内\n訳を示してください。\n\n（2）補助対象となる経費は、次の①～③の条件をすべて満たすものとなります。\n\n       ① 使用目的が本事業の遂行に必要なものと明確に特定できる経費\n       ② 交付決定日以降に発生し補助事業期間中に支払が完了した経費\n       ③ 証憑資料等によって支払金額が確認できる経費\n\n（3）補助対象となる経費は、次に掲げる経費であり、これ以外の経費は本事業の補助対象外です。\n\n\n\n ①機械装置等費、②広報費、③ウェブサイト関連費、④展示会等出展費（オンラインによる展示会・商談\n 会等を含む）、⑤旅費、⑥新商品開発費、⑦借料、⑧委託・外注費\n\n\n\n ①機械装置等費\n  補助事業の遂行に必要な機械装置等の購入に要する経費\n\n ○通常の事業活動のための費用、単なる取替え更新の機械装置等の購入は補助対象外です。\n ○単価 50 万円（税抜き）以上の機械装置等の購入は「処分制限財産」に該当し、補助事業が終了し、補\n  助金の支払を受けた後であっても、一定の期間において処分（補助事業目的外での使用、譲渡、担保\n  提供、廃棄等）が制限されます。\n   処分制限期間内に当該財産を処分する場合には、必ず補助金事務局へ承認を申請し、承認を受\n  けた後でなければ処分できません。補助金事務局は、財産処分を承認した補助事業者に対し、当該\n  承認に際し、残存簿価等から算出される金額の返還のため、交付した補助金の全部または一部に相\n  当する金額を納付させることがあります。承認を得ずに処分を行うと、交付規程違反により補助金\n  交付取消・返還命令（加算金付き）の対象となります。\n ○発注総額(1 件あたり)が 50 万円（税込）超の機械装置等の購入をする場合、価格の妥当性を確認す\n  るため、2 者以上からの見積が必要です。\n ○ウェブサイト、システム開発等に関連するソフトウェアは、③ウェブサイト関連費で計上してください。\n ○中古品の購入は、下記の条件を満たした場合のみ、補助対象経費として認めます。\n  (ア) 購入単価が 50 万円（税抜き）未満のものであること\n      ※単価が 50 万円（税抜き）以上の中古品を単価 50 万円（税抜き）未満になるように分割して購\n       入する場合は、その中古品全体が補助対象外となります。\n  (イ) 中古品の購入にあたっては 2 者以上の中古品販売事業者（個人からの購入や、オークション（イン\n      ターネットオークションを含みます）による購入は不可）から同等品について見積（見積書、価格表\n      等）の取得が必要です。\n      ※中古品購入の場合は、購入金額に関わらず、すべて、2 者以上からの見積が必要です。\n      ※採択発表後交付決定まで、および、実績報告書の提出時に、これら複数の見積書を必ず添付\n       してください。（理由書の提出による随意契約での購入は、一切認められません。）\n  (ウ) 修理費用は、補助対象経費として認められません。また、購入品の故障や不具合等により補助事\n      業計画の取組への使用ができなかった場合には、補助対象外となります。\n\n        対象となる経費例                  対象とならない経費例\n\n\n\n                          12\n\n\n--- ページ区切り ---\n\n 高齢者・乳幼児連れ家族の集客力向上のた  自動車等車両（「減価償却資産の耐用年数等に関\n  めの高齢者向け椅子・ベビーチェア          する省令（昭和 40 年大蔵省令第 15 号）」の「機\n 衛生向上や省スペース化のためのショーケー      械及び装置」区分に該当するものを除く）\n  ス                        自転車・文房具等・パソコン・事務用プリンター・複\n 生産販売拡大のための鍋・オーブン・冷凍冷      合機・タブレット端末・WEB カメラ・ウェアラブル端\n  蔵庫                        末・PC 周辺機器（ハードディスク・ＬＡＮ・Ｗｉ－Ｆ\n 新たなサービス提供のための製造・試作機械      ｉ・サーバー・モニター・スキャナー・ルーター、ヘッ\n  （特殊印刷プリンター、3Ｄプリンター含む）     ドセット・イヤホン等）・電話機・家庭用電気機械器\n 自動車等車両のうち「減価償却資産の耐用       具・その他汎用性が高く目的外使用になりえるも\n  年数等に関する省令（昭和 40 年大蔵省令第    の\n  15 号）」の「機械及び装置」区分に該当するも  （ある機械装置等を商品として販売・賃貸する事\n  の（例：ブルドーザー、パワーショベルその他     業者が行う）当該機械装置等の購入・仕入れ（デ\n  の自走式作業用機械設備）              モ品・見本品とする場合でも不可）\n                           単なる取替え更新であって新たな販路開拓につ\n                            ながらない機械装置等\n                           古い機械装置等の撤去・廃棄費用\n                           船舶\n                           動植物\n                           顧客に貸与する事業運営（駐車場経営、貸倉庫経\n                            営、コインランドリー事業等）における機械装置等\n n 金額を納付させることがあります。承認を得ずに処分を行うと、交付規程違反により補助金交付取消・\n 返還命令（加算金付き）の対象となります。\n※補助金の交付を受けた補助事業の目的を遂行するために必要なホームページの改良や機能強化は、\n 補助金事務局への事前承認申請等が必要となる「処分」には該当しません。\n\n        対象となる経費例                     対象とならない経費例\n オフライン含むシステム開発                 ウェブサイトおよびシステムに関連するコンサル\n 顧客管理システムの構築                    ティング、アドバイス費用\n アプリケーション開発                    電子書籍の出版に係る費用（新商品開発費で\n 業務効率化のためのソフトウェア                も対象外）\n 販路開拓等のための特定業務用ソフトウェア          販売を目的としたシステムやソフトウェア開発\n  （精度の高い図面提案のための設計用 3 次元         （新商品開発費でも対象外）\n  ＣＡＤソフト、販促活動実施に役立てる顧客管         家庭および一般事務用ソフトウェア\n  理ソフト等）※ただし POS ソフトは補助事業計      既に導入しているソフトウェアの更新料\n  画の「Ⅰ．補助事業の内容」の 3.業務効率化        補助事業期間内に運用に至らなかったホーム\n  （生産性向上）の取組内容に記載した場合に限          ページ・ランディングページ\n  る                             有料配信する動画の制作費\n 商品販売のためのウェブサイト作成や更新           有料の講座で使用する動画や電子教材の作成\n\n\n                          14\n\n\n--- ページ区切り ---\n\n 効果や作業内容が明確なウェブサイトの SEO  ウェブサイトに使用する画像等における被写体\n  対策                       や商品（紹介物等を含む）の購入に係る費用\n 商品販売のためのウェブサイトに掲載する宣材\n  写真の制作費用\n ウェブサイトに掲載する商品・サービスを販売す\n  るための画像や動画作成費用\n④展示会等出展費（オンラインによる展示会・商談会等を含む）\n 新商品等を展示会等に出展または商談会に参加するために要する経費\n\n○展示会出展の出展料等に加えて、関連する運搬費（レンタカー代、ガソリン代、駐車場代等は除く）・通\n 訳料・翻訳料も補助対象となります。\n○海外展示会等の出展費用の計上にあたり外国語で記載の証拠書類等を実績報告時に提出する場合\n には、当該書類の記載内容を日本語で要約・説明する書類もあわせてご提出ください。\n○自社で開催するイベントの会場を借りるための費用は、⑦借料に該当します。\n○出展等にあたり必要な機械装置等の購入は、①機械装置等費に該当します。\n○採択結果の公表（P.3）および交付決定は、当初予定より遅延する場合があります。補助事業の計画に\n  あたっては、スケジュールに十分な余裕を確保したうえで策定してください。\n○下記に該当する展示会等出展費は補助対象外です。\n 国（国以外の機関が、国から受けた補助金等により実施する場合を含む）により出展料の一部助成を\n  受けるもの\n 請求書の発行日や出展料等の支払日が交付決定日より前となるもの\n   （展示会等の出展について、出展申込みは交付決定前でも構いません。）\n 販売のみを目的とし、販路開拓に繋がらないもの\n 補助事業期間外に開催される展示会等に係るもの\n 選考会、審査会（○○賞）等への参加・申込費用\n 実績報告の際に提出する証拠書類の翻訳料\n 文房具等の事務用品等の消耗品代\n 飲食費を含んだ商談会参加費等\n⑤旅費\n 補助事業計画（様式 2）に基づく販路開拓 (展示会・商談会等の会場との往復を含む。)等を行うため\n の旅費\n\n○補助事業計画に基づく販路開拓を行うための出張である旨を記載した出張報告の作成等により、必\n 要性が確認できるものが補助対象となります（補助事業計画に明記されていない出張の場合は、補助\n 対象外経費となります）。通常の営業活動に要する経費とみなされる場合は補助対象外です。\n○補助対象経費は国が定める旅費の支給基準を踏まえた基準により算出することとします。旅費の支給\n 基準は、後日公開する別紙「参考資料」をご参照ください。\n○移動に要する経費については、公共交通機関を用いた最も経済的および合理的な経路により算出さ\n れた実費となります。\n○海外旅費の計上にあたり外国語で記載の証拠書類を実績報告時に提出する場合には、当該書類の\n 記載内容を日本語で要約・説明する書類もあわせてご提出ください（実績報告の際に提出する証拠書\n 類の翻訳費用は補助対象外です）。\n○必要最低限の人数分のみ補助の対象となります（補助金事務局から必要性や妥当性を確認させてい\n ただく場合があります）。\n\n\n\n                       15\n\n\n--- ページ区切り ---\n\n○採択結果の公表（P.3）および交付決定は、当初予定より遅延する場合があります。補助事業の計画に\n あたっては、スケジュールに十分な余裕を確保したうえで策定してください。\n       対象となる経費例                     対象とならない経費例\n\n 販路開拓のための展示会等への出展に係る宿        国の支給基準の超過支出分\n  泊施設への宿泊代                    日当\n バス運賃・電車賃・新幹線料金（指定席購入 含      ガソリン代・駐車場代・タクシー代・レンタカー\n  む）・航空券代（燃油サーチャージ含む。エ コノ     代・高速道路通行料・グリーン車・ビジネスクラ\n  ミークラス分の料金までが補助対象）、航空保       ス等の付加料金分\n  険料、出入国税                     朝食付き・温泉入浴付き宿泊プランにおける朝\n                              食料金・入浴料相当分\n                              視察・セミナー等参加のための旅費\n                              個社同士の商談や単なる営業活動に係る旅費\n                              パスポート取得料\n                              国の助成制度を利用して支払われた経費\n⑥新商品開発費\n 新商品の試作品や包装パッケージの試作開発にともなう原材料、設計、デザイン、製造、改良、加工す\n るために支払われる経費\n\n○購入する原材料等の数量はサンプルとして使用する必要最小限にとどめ、補助事業終了時には使い\n 切ることが必要です（実際に使用したもののみが補助対象です）。\n○原材料費を補助対象経費として計上する場合は、受払簿（任意様式）を作成し、その受け払いを明確\n にしておく必要があります。\n○テストマーケティングや市場調査を行った結果を踏まえたもの、または、それらを伴うものが補助対象\n となります。実施したテストマーケティングまたは市場調査の内容及びその結果を、補助事業計画（様\n 式２）に記載してください。なお、申請時点において当該テストマーケティングまたは市場調査が未実施\n の場合には、実績報告時に提出する実績報告書（様式第８）において、その内容および結果を記載して\n ください。\n 申請時または実績報告時のいずれにおいても、当該内容および結果の記載が確認できない場合は、\n 当該経費は補助対象外となります。\n\n\n       対象となる経費例                     対象とならない経費例\n 新製品・商品の試作開発用の原材料の購入         文房具等\n 新たな包装パッケージに係るデザイン費用         開発・試作した商品をそのまま販売する場合の\n                               開発費用\n                              試作開発用目的の購入で使い切らなかった材\n                               料分\n                              デザインの改良等をしない既存の包装パッケー\n                               ジの印刷・購入\n                              （包装パッケージの開発が完了し）実際に販売\n                               する商品・製品を包装するために印刷・購入す\n                               るパッケージ分\n                              システム開発・構築（③ウェブサイト関連費にて\n                               計上してください）\n\n\n\n                        16\n\n\n--- ページ区切り ---\n\n⑦借料\n 補助事業遂行に直接必要な機器・設備等のリース料・レンタル料として支払われる経費\n\n○採択発表後交付決定までに、見積書等が確認できるもので、本事業に要する経費のみ補助対象とな\n ります。実績報告の際にも契約書等で契約内容を確認し、契約期間が補助事業期間を越える場合は、\n 按分等の方式により算出された補助事業期間分のみ補助対象となります。\n○自主事業など補助事業以外にも使用するもの、通常の生産活動のために使用するものは補助対象外\n です。\n○事務所等に係る家賃は補助対象となりません。ただし、既存の事務所賃料ではなく、新たな販路開拓\n の取組の一環として新たに事務所等を賃借する場合は、対象となる場合があります。なお、審査時に\n 床面積の按分資料が必要となります。\n○商品・サービス PR イベントの会場を借りるための費用は、⑦借料に該当します。\n\n⑧委託・外注費\n 上記①から⑦に該当しない経費であって、補助事業遂行に必要な業務の一部を第三者に委託（委\n 任）・外注するために支払われる経費（自ら実行することが困難な業務に限ります。）\n\n○デザイン会社によるデザインの外注など、補助事業者が通常事業として実施している業務については、\n 自ら実行することが困難な業務に含まれません。\n○委託内容、金額等が詳細に明記された契約書等を締結し、委託する側である補助事業者に成果物等\n が帰属する必要があります。\n○例えば市場調査の実施にともなう記念品代、謝礼等は補助対象外となります。\n○ウェブサイト、システム開発等に係る委託・外注費については、③ウェブサイト関連費にて計上してくだ\n さい。\n○実績報告の際に成果物が分かる資料の提出が必要になります。特にインボイス制度対応のためのコン\n サルティングを受けた場合、成果物が分かる資料が不足していることが多々ありますので、コンサルテ\n ィング内容の実施報告書など実施内容が確認できる資料を提出してください。\n○発注した業務の実務すべてを再委託することを前提とした経費は補助対象外です。\n〇住宅宿泊事業者が改装を行う場合、「住宅のうち事業の用に供する部分の面積」により按分した金額\n が対象となります。\n また、計算根拠となる平面図等については、採択後、交付決定までの間に提出が必要になります。\n 詳しくは後日公開する「申請時によくあるご質問」をご参照ください。\n○店舗改装において 50 万円（税抜き）以上の外注工事を行う場合等、「処分制限財産」に該当し、補助\n 事業が終了し、補助金の支払を受けた後であっても、一定の期間において処分（補助事業目的外での\n 使用、譲渡、担保提供、廃棄等）が制限されることがあります。\n  処分制限期間内に当該財産を処分する場合には、必ず補助金事務局へ承認を申請し、承認を受け\n た後でなければ処分できません。補助金事務局は、財産処分を承認した補助事業者に対し、当該承認\n に際し、残存簿価等から算出される金額の返還のため、交付した補助金の全部または一部に相当する\n 金額を納付させることがあります。承認を得ずに処分を行うと、交付規程違反により補助金交付取消・\n 返還命令（加算金付き）の対象となります。\n○補助金応募書類・実績報告書等の作成・送付・手続きに係る費用については、補助対象外となります。\n        対象となる経費例                  対象とならない経費例\n 店舗改装・バリアフリー化工事             補助事業で取り組む販路開拓や業務効率化に\n 利用客向けトイレの改装工事               結びつかない工事（単なる店舗移転を目的とし\n                              た旧店舗・新店舗の解体・建設工事、住宅兼店\n\n\n\n                       17\n\n\n--- ページ区切り ---\n\n  製造・生産強化のためのガス・水道・排気工事          舗の改装工事における住宅部分、既存の事業\n  移動販売等を目的とした車の内装・改造工事           部門の廃止にともなう設備の解体工事など）\n                                 「建物の増築・増床」や「小規模な建物（コンテ\n  （補助事業計画の「Ⅰ．補助事業の内容」の「3.\n                                  ナハウス等）の設置」など「不動産の取得」に係\n   業務効率化（生産性向上）の取組内容」に記載し\n                                  る費用（※）\n   た場合に限り）従業員の作業導線改善のための\n                                 顧客に貸与する事業運営（駐車場経営、貸倉\n   従業員作業スペースの改装工事\n                                  庫経営、コインランドリー事業等）におけるスペ\n  インボイス制度対応のための取引先の維持・拡          ース等の改装\n   大に向けた専門家（税理士、公認会計士、中小         購入した設備を自ら占有し、事業の用に供する\n   企業診断士等）への相談費用                  ことなく、特定の第三者に長期間賃貸するよう\n                                  な事業運営におけるスペース等の改装\n                                 テレフォンアポイントメント等、営業代行業務の\n                                  委託に係る費用\n                                 「諸経費」などの委託・外注に係る内訳が不明\n                                  な費用\n  ※「建物の増築・増床」や「小規模な建物（物置等）の設置」の場合、「不動産の取得」に該当する以下の\n   3 つの要件すべてを満たすものは、補助対象外となります。（固定資産税の課税客体である「家屋」\n   の認定基準の考え方を準用）。\n   （ア）外気分断性：\n      屋根および周壁またはこれに類するもの（三方向以上壁で囲われている等）を有し、独立して風\n      雨をしのぐことができること。一方、支柱と屋根材のみで作られた飲食店の戸外テラス席や、駐\n      輪場・カーポート等、周壁のないものは「外気分断性」は認められないため、「不動産の取得」に\n      は該当しない。\n   （イ）土地への定着性：\n      基礎等で物理的に土地に固着していること。一方、コンクリートブロックの上に、市販の簡易物\n      置やコンテナを乗せただけの状態のものは「土地への定着性」は認められないため、「不動産の\n      取得」には該当しない。\n   （ウ）用途性：\n      建造物が家屋本来の目的（居住・作業・貯蔵等）を有し、その目的とする用途に供しうる一定の\n      利用空間が形成されていること。\n\n\n\n（4）補助対象外となる経費\n 上記(3)①から⑧に掲げる経費においても、下記に該当する経費は対象となりません。また、計上されて\n いる経費の大半が補助対象外である場合、補助事業の円滑な実施が困難であるとして、不採択・採択取\n 消になりますので、ご注意ください。\n\n ①国が助成するほかの制度を利用している事業と重複する経費\n\n  ○就労継続支援Ａ型事業所・Ｂ型事業所など障害福祉サービス事業と重複する経費\n  ○デイサービス・介護タクシー等の居宅介護サービス事業者で介護報酬が適用されるサービス\n  ○保険適用診療にかかる経費（薬局、整骨院や鍼灸院等の保険診療で使用する機械や保険診療の宣\n   伝も兼ねるチラシ等）\n\n ②通常の事業活動に係る経費\n\n  ○販売している商品の仕入\n\n\n                           18\n\n\n--- ページ区切り ---\n\n○老朽化した既存機械の取替え費用\n○応接室のソファや従業員が使用する事務机の購入費用\n③販売や有償レンタルを目的とした製品、商品等の生産・調達に係る経費\n○塾や教室等で使用する有料教材の制作費用\n○レンタル事業を営む事業者がレンタル機材を購入する費用\n○電子書籍や本の出版に係る費用（電子書籍に係る費用は新商品開発費でも対象外）\n\n④他社のために実施する経費\n\n○他社の販路開拓につながる取組\n○他社の商品を宣伝するための HP 制作費や他社製品を製造するための機械の導入\n○他社への寄付金や協賛金\n⑤自動車等車両\n○自動車\n○フォークリフト\n○キッチンカー\n○除雪車\n○キッチントレーラー など\n\n⑥上記のほかに、補助対象経費として認められない経費\n\n○補助事業の目的に合致しないもの\n○必要な経理書類（見積書・請求書・領収書等）を用意できないもの\n○事業実施内容の確認のために必要な証憑（成果物の写真、業務完了報告書、その他補助金事務局\n が事業実態の確認のために提出を求めるもの）を用意できないもの\n○交付決定前に発注・契約、購入、支払い（前払い含む）等を実施したもの\n ※展示会等への出展の申込みについてのみ、交付決定前の申込みでも補助対象となります（ただ\n  し、請求書の発行が交付決定日以後でなければ補助対象外です）\n○自社内部やフランチャイズチェーン本部との取引によるもの（フランチャイズチェーン指定の機器等を\n 本部以外から購入する場合等も含みます）\n〇社内の役員・従業員や代表者・役員の親族（3 親等以内）へ発注しているもの、あるいは代表者・役\n 員の親族（3 親等以内）が代表または役員に就いている事業者へ発注しているもの。財務諸表等規\n 則第 8 条で定義されている親会社、子会社、関連会社および関係会社へ発注しているもの。\n○新品・中古品問わず、（開業していない）個人からの購入やオークションによる購入（インターネットオ\n ークションを含みます）\n○駐車場代、保証金、敷金、仲介手数料、光熱水費\n○電話代、インターネット利用料金等の通信費\n○消耗品（名刺、文房具、インクカートリッジ、用紙、はさみ、テープ類、クリアファイル、無地封筒、\n OPP・CPP 袋、CD・DVD、USB メモリ・SD カード、電池、段ボール、梱包材、タオル、シーツ、化粧\n 品の購入など）\n○展示・インテリアを目的とした美術品や骨董品等の購入\n○雑誌購読料、新聞代、団体等の会費\n○茶菓、飲食、奢侈、娯楽、接待の費用\n○不動産購入・取得費、修理費、車検費用\n○税務申告、決算書作成等のために税理士、公認会計士等に支払う費用および訴訟等のための弁護\n 士費用\n\n\n                         19\n\n\n--- ページ区切り ---\n\n  ○金融機関などへの振込手数料、代引手数料、インターネットバンキング利用料、インターネットショッ\n   ピング決済手数料等\n  ○公租公課（消費税・地方消費税は、（消費税等を補助対象経費に含めて補助金交付申請額を申請\n   し、その内容で交付決定を受けた「免税事業者・簡易課税事業者・2 割特例（インボイス発行事業者と\n   なる小規模事業者に対する負担軽減措置） の申請者」を除き、）補助対象外とする。ただし、旅費に係\n   る出入国税は補助対象とする。）\n  ○各種保証・保険料（ただし、旅費に係る航空保険料、展示会等出展で主催者から義務付けられた保\n   険料に係るものは補助対象とする。）\n  ○借入金などの支払利息および遅延損害金\n  ○免許・特許等の取得・登録費\n  ○講習会・勉強会・セミナー研修等参加費や受講費等、図書等の資料購入費\n  ○商品券・金券の購入、仮想通貨・クーポン・（クレジットカード会社等から付与された）ポイント・金券・\n   商品券（プレミアム付き商品券・地域振興券等を含む）での支払い、自社振出・他社振出にかかわら\n   ず小切手・手形・相殺による決済・支払い\n  ○役員報酬、直接人件費\n  ○各種キャンセルに係る取引手数料等\n  ○補助金応募書類・実績報告書等の作成・送付・手続きに係る費用\n  ○購入額の一部又は全額に相当する金額を口座振込や現金により申請者へ払い戻す（ポイント・クー\n   ポン等の発行を含む）ことで、購入額を減額・無償とすることにより、購入額を証明する証憑に記載\n   の金額と実質的に支払われた金額が一致しないもの\n   ※補助事業者の自己負担額を減額又は無償とするような販売方法（形式・時期の如何を問わず、補\n   助事業者に実質的に還元を行うもの。キャッシュバックを含む）あるいは、一部の利害関係者に不当\n   な利益が配賦されるような行為については、本事業全体を通じて補助金交付の目的に反する行為と\n   みなします。\n  ○クラウドファンディングで発生しうる手数料（返礼品、特典等を含む）\n  ○1 取引 10 万円（税抜き）を超える現金支払\n  ○補助事業期間内に支出が完了していないもの（分割払い、クレジットカード決済、リボルビング支払\n   等の場合、金融機関等から引き落としが補助事業期間内に完了していることが必要。）\n  ○売上高や販売数量、契約数等に応じて課金される経費や成功報酬型の費用\n  ○謝金\n  ○雑役務費（アルバイト代などの人件費、派遣労働者の派遣料、交通費として支払われる経費等）\n  〇内訳が不明な経費（諸経費など）\n  ○コンサルティング、アドバイス費用（インボイス制度対応のための専門家への相談費用は除く）\n  ○上記の他、公的な資金の用途として社会通念上、不適切と認められる経費\n\n\n（5）補助対象経費全般にわたる留意事項\n 経費の支出等について\n   補助対象となる経費は、補助事業期間中に、「販路開拓等（業務効率化（生産性向上）を含む）の取\n  組」を実施したことに要する費用の支出に限られます。補助事業期間中に発注や引き渡し、支払等があ\n  っても、実際の事業取組が補助対象期間外であれば、当該経費は補助対象外となります。補助事業実\n  施期間中に実際に使用し、補助事業計画に記載した取組をしたという実績報告が必要となります。\n    例：① 機械装置等を購入したものの、補助事業終了までに当該機械装置等を使用して補助事業\n    計画に記載した販路開拓等の取組を行っていない場合（当該機械装置等を使用して販路開拓等\n    の取組を行った旨の記載が実績報告書にない場合も含みます。以下同様。）には、当該機械装置\n\n\n                        20\n\n\n--- ページ区切り ---\n\n    等の購入費は補助対象外となります。\n    例：② 新聞・雑誌等への広告掲載契約を締結し、広告掲載料を支払ったものの、補助事業終了ま\n    でに広告掲載した新聞・雑誌等の発行による広報がされない場合や、ホームページで受注システ\n    ムを作成したものの、補助事業終了までにホームページにて公開して販路開拓の取組を行ってい\n    ない場合も、当該経費は補助対象外となります。\n（6）経費の支払方法について\n   補助事業実施期限までに支払いと事業の遂行が完了したもののみが補助金の対象となります。補助\n  対象経費の支払方法は銀行振込が大原則です。補助金執行の適正性確保のため、旅費や現金決済の\n  みの取引（代金引換限定のサービス等）を除き、1 取引 10 万円超（税抜き）の支払は、現金支払いは認\n  められません。\n   自社振出・他社振出にかかわらず、小切手・手形・相殺による支払いは不可です。また、補助事業者\n  から相手方へ資金の移動が確認できないため、相殺（売掛金と買掛金の相殺等）による決済は認めら\n  れません。\n   また、クレジット払いは申請する事業者の名義であり、補助事業期間内に支出が完了しているもの\n  （分割払い、クレジットカード決済、リボルビング支払等の場合、金融機関等から引き落としが補助事業\n  期間内に完了していることが必要になります。）に限ります。\n   代表者や従業員が、個人のクレジットカードで支払いを行った場合は、「立替払い」として、帳簿等で\n  確認ができない場合には補助対象外となります。\n\n（7）電子商取引について\n  ○インターネット広告の配信等において電子商取引を行う場合でも、上記（2）③のとおり「証拠資料等\n   によって支払い金額が確認できる経費」のみが対象となります。\n  ○取引相手先によく確認し、補助金で求められる、仕様提示、見積、発注、納品、検収、請求、支払とい\n   った流れで調達を行い、適切な経理処理の証拠となる書類（取引画面の写し等）を整理・保存・提出\n   ができることを把握してから取引をしてください。\n  ○実際に経費支出を行っていたとしても、取引相手先の都合等により、発注した日が確認できる取引\n   画面を提出できない、補助対象経費として計上する取引分の請求額が判明する書類が提出できな\n   い、広告が確認できるインターネット画面が取得できない等の場合には、補助対象外となります。\n  ○いわゆる電子マネーでの支払いをしようとする場合でも、補助事業者からの支出であることに加え、\n   上記と同様、補助金で求められる、一連の経理処理の証拠となる書類を整理・保存・提出ができるも\n   のに限り補助対象となります。\n\n\n（8）補助事業の区分経理\n   補助事業を行うにあたっては、当該事業について区分経理を行ってください。補助対象経費は当該\n  事業に使用したものとして明確に区分できるもので、かつ証拠書類によって金額等が確認できるものの\n  みとなります。\n\n\n（9）発注先選定の相見積（2 者以上からの見積）について\n   補助事業における発注先（委託先）の選定にあたっては、発注総額(1 件あたり)が 50 万円超（税込）\n  を要するものについては、2 者以上から見積を取り、より安価な発注先（委託先）を選んでください。た\n  だし、発注（委託）する事業内容の性質上、見積を取ることが困難な場合は、該当企業等を随意契約の\n  対象とする理由書を採択発表後交付決定までにご提出ください。なお、中古品の購入については、金額\n  に関わらず、すべて、2 者以上からの見積が必須となります。この場合、理由書の提出による随意契約\n\n\n\n                          21\n\n\n--- ページ区切り ---\n\n  での購入は、補助対象外となります。\n   相見積は価格の妥当性を確認するために提出を求めるものです。公的な資金を活用しての事業で\n  あることも踏まえ、必ず補助事業者自身が別々の企業から取得するようにしてください。金額が市場価\n  格から著しく乖離しているなど、社会通念上価格が妥当ではないと判断される経費につきましては補助\n  対象外となります。\n\n\n8．申請手続\n\n（1）受付開始及び締切\n ○公募要領公開：     2026 年 5 月 27 日（水）\n ○申請受付開始：     2026 年 11 月 5 日（木）\n ○申請受付締切：     2026 年 12 月 15 日（木）17:00\n              （事業支援計画書（様式 4）発行の受付締切 2026 年 12 月 4 日（金））\n              ※予定は変更する場合があります。\n\n（2）申請手続きの基本的な流れ\n ①「11．申請に必要な書類」(Ｐ.26)および後日公開する申請システム操作手引きを確認の上、申請に必\n  要な書類を用意してください。\n ②申請をするまでに、電子申請システムへ「経営計画」および「補助事業計画」の入力をして申請内容を印\n  刷し、希望する特例や加点等に関する書類等を添付の上、地域の商工会・商工会議所に「事業支援計\n  画書」（様式 4）の発行依頼を行い、発行を受けてください。「事業支援計画書」（様式 4）の発行を受け\n  るにあたり、申請者に事業計画の内容や提出書類の過不足（特例に申請される場合は、要件を満たし\n  ているかも含む）等について確認をさせていただきます。\n   ※開設時間はお近くの商工会・商工会議所にご確認ください。また、訪問時には事前にご連絡をお願\n     いします。\n   ※事業支援計画書（様式 4）について、受付締切以降の発行依頼は、いかなる理由があってもできま\n     せん。また、補助対象者の要件を満たしていないと判断される場合も発行はできません。\n ③商工会地区：電子申請システム内にて地域の商工会へ「事業支援計画書」（様式 4）の発行依頼を行い、\n  商工会の窓口へ行って発行を受けてください（発行のために面談を行います）。発行されると電子申請\n  システムに反映されます（発行されるまで申請を完了できません）。\n  商工会議所地区：地域の商工会議所へ発行依頼を行い、「事業支援計画書」（様式 4）の発行を受けて\n  ください。発行を受けた「事業支援計画書」（様式 4）の PDF ファイルを電子申請システムへアップロー\n  ドしてください（電子申請システムにアップロードするまで申請を完了できません）。\n ④受付締切までに、必要な提出物（「11．申請に必要な書類」をよくご確認ください）を全て揃え、申請（受\n  付締切時間は 17：00）してください。\n ⑤採択後は、計上しているすべての経費について見積書等を提出いただき、補助金事務局での審査を経\n  て交付決定となります。\n\n ＜申請手続きにおける留意点＞\n  本事業は、小規模事業者自身が、経営計画・補助事業計画等の策定時や採択後の補助事業実施の際\n  に、商工会・商工会議所の支援を直接受けながら取り組む事業です。このため、社外の代理人のみで、\n  地域の商工会・商工会議所へ相談や「事業支援計画書（様式 4）」の発行依頼等を行うことはできませ\n  ん。\n\n\n\n\n                            22\n\n\n--- ページ区切り ---\n\n（3）申請先及び留意事項\n\n     申請先ＵＲＬ\n\n                              現在調整中\n\n\n ○本事業の申請に際しては、電子申請システムをご利用ください。電子申請システムを利用するにはＧビ\n  ズＩＤプライムもしくはＧビズＩＤメンバーのアカウント取得が必要です。アカウントの取得には数週間程\n  度を要しますので、未取得の方はお早めに利用登録を行ってください。同アカウントは、採択後の手続\n  きについてもご利用いただきます。\n ○既にＧビズＩＤアカウントを取得しているが登録情報が古い場合、必ず最新の情報に更新してから申請\n  してください。事業者情報を更新せずに申請・採択された場合、G ビズ ID の情報を最新化しなければ\n  補助金の額の確定を受けられません。\n ○補助金事務局ホームページに後日公開する「申請システム操作手引き」の指示に従って、入力漏れや\n  誤りがないよう、申請してください。添付書類については、pdf、zip、png、bmp、jpg、jpeg、gif、\n  heic、doc、docx、xls、xlsx で作成してください。「11．申請に必要な書類」(Ｐ.26)を参照し、決めら\n  れたファイル名をつけ、所定の場所に添付してください。\n   ※ 添付資料が所定の場所に登録されていない場合やファイルの作成方法等の不備またはパスワー\n      ドの設定等により補助金事務局にて内容の確認ができない場合は、審査ができませんので十分\n      ご注意ください。\n ○暫定 G ビズ ID プライムアカウントは使用できません。\n\n ＜電子申請システムの利用環境＞\n  電子申請システムの動作確認済み環境は以下のとおりです。下記のブラウザの最新バージョンをご利\n  用ください。下記以外のブラウザ（Internet Explorer 等）は、申請上のエラー等が生じますので利用\n  しないでください。\n  ○ Windows       ：Google Chrome, Microsoft Edge\n  ○ macOS         ：Google Chrome, Safari\n  ○ iOS           ：Safari\n  ○ Android       ：Google Chrome\n  ※Microsoft Edge の「Internet Explorer モード」は申請上のエラー等が生じますので利用しない\n   でください。\n\n（4）提出資料\n 「11．申請に必要な書類」（P.26） で定める提出資料を提出してください。なお、必要に応じて追加資料の\n 提出および説明を求めることがあります。また、申請書類等の返却はいたしません。\n ※マイナンバー（12 桁の個人番号）の提供は不要のため、提出書類に記載されている場合は、番号が見\n  えないよう黒塗りしてください。\n\n（5）応募件数\n 同一事業者からの同一受付締切回への応募は 1 件とします。\n\n\n\n                              23\n\n\n--- ページ区切り ---\n\n ○代表者が同じ複数の法人で同一事業に申請することや、同一の個人が個人事業主として、かつ代表を\n  務める法人等で同一事業に申請することはできません。\n ○万が一、複数応募が判明した場合には、すべて不採択となります（採択後に複数応募が判明した場合\n  も、遡って採択を取り消します）。\n ○複数の屋号を使用している個人事業主も応募は 1 件のみです。\n\n\n9．補助事業実施期間等\n\n各回で予定する「補助事業実施期間」「補助事業実績報告書提出期限」は次のとおりです。\n   受付締切               補助事業実施期間               補助事業実績報告書提出期限\n第 17 回受付締切分   交付決定日より 2026 年 7 月 31 日（金）まで    2026 年 8 月 10 日（月）\n第 18 回受付締切分   交付決定日より 2027 年 2 月 26 日（金）まで    2027 年 3 月 10 日（水）\n第 19 回受付締切分   交付決定日より 2027 年 6 月 30 日（水）まで    2027 年 7 月 10 日（土）\n第 20 回受付締切分   交付決定日より 2028 年 3 月 31 日（金）まで    2028 年 4 月 10 日（月）\n※上記実施期間の途中で、補助事業が終了（補助対象経費の支払いまで含みます）したときは、その日か\n ら起算して 30 日を経過した日、または上記「補助事業実績報告書提出期限」のいずれか早い日までに\n 実施事業内容および経費内容を取りまとめ、提出しなければなりません。\n※交付決定には、採択後、詳細な見積書が速やかに提出された場合でも、採択発表から概ね 1〜2 か月\n かかる場合があります。（あくまで目安であり、状況により変動しますのでご注意ください。）\n\n\n\n10．補助事業者の義務（採択後に遵守すべき事項）\n\n本事業の交付決定を受けようとする者及び交付決定を受けた事業者は、今後掲載予定の「補助事業の手\n引き」に従って手続きを進めていただくとともに、以下の条件を守らなければなりません。\n\n（1）採択発表後交付決定までに、経費の価格の妥当性を証明できる見積書等（相見積含む）の提出が必\n  要です。支出内容が不明確なものは認められません。見積金額に複数の項目が含まれる場合は、その\n  内訳を示してください。なお、見積書の提出期限は 2028 年2 月 29 日（火）です。提出期限までに見\n  積書等の提出がなされていない場合は、採択取消しとします。\n\n（2）採択となっても、対象外経費の計上等の不備が発見された場合には、補助金事務局の指示に従って\n  申請書類の訂正・再提出が必要です。\n  補助対象外経費の計上が発見された場合には、当該支出を除いて補助対象経費を算出しなければな\n  りません。速やかにご対応いただけない場合は、採択されても交付決定できないことがあります。\n\n（3）「補助金交付決定通知書」の受領前は、補助対象となる経費支出等はできません。\n  補助金の対象となる経費の発注・契約・支出行為は、「補助金交付決定通知書」に記載された交付決\n  定日から可能です。補助金交付決定通知書の前に送付される採択通知書だけでは、補助事業を始め\n  ることはできませんのでご注意ください。交付決定日前に行われた発注・契約・支出行為は、補助対象\n  外です。\n\n（4）補助事業の内容等を変更、又は本事業を中止、廃止等する際には事前の承認が必要です。\n  交付決定後、補助事業の経費の配分や内容を変更しようとする場合、又は補助事業を中止（一時中\n  断）、廃止（実施取りやめ）や他に承継させようとする場合は、事前に補助金事務局の承認を得なけれ\n\n\n                              24\n\n\n--- ページ区切り ---\n\n ばなりません。原則として補助事業計画に記載のない新しい費目の追加は認められません。補助事業\n の目的達成のために必要不可欠であると認められる場合に限り、新しい費目の追加と経費の流用に\n 係る変更申請が認められることがあります。\n なお、「業務効率化（生産性向上）の取組」による経費支出は、あらかじめ申請時に所定の様式内に内\n 容を記載し、「経費明細表」に計上していることが前提条件となりますので、いずれも、変更承認手続に\n より事後に補助対象経費に加えることはできません。\n\n（5）定められた期日までに実績報告書等を提出しなければなりません。\n  補助事業の終了後、実績報告書（交付規程様式第 8）および支出内容の分かる関係書類等を、定めら\n  れた期日までに補助金事務局に提出しなければなりません。定められた期日までに実績報告書等の\n  提出が補助金事務局で確認できなかった場合、交付決定を取り消します。\n\n(6)実績報告書等に不備が発見された場合には、補助金事務局の指示に従って実績報告書等を訂正し、\n  速やかに再提出しなければなりません。\n\n(7)実績報告時に要件を満たしていると認められない場合には、「補助金交付決定通知書」に記載した交\n  付金額より少なくなる場合（交付決定を取り消す場合も含む）があります。\n\n（8）所定の取得財産等の目的外使用、譲渡、担保提供、廃棄等の処分には制限があります。\n  単価 50 万円（税抜き）以上の機械装置等の購入や、自社ウェブサイトの外注による作成、店舗改装に\n  よる不動産の効用増加等は、「処分制限財産」に該当し、補助事業が終了し、補助金の支払を受けた\n  後であっても、一定の期間において処分（補助事業目的外での使用、譲渡、担保提供、廃棄等）が制\n  限されます。\n  処分制限期間内に当該財産を処分する場合には、必ず補助金事務局へ承認を申請し、承認を受けた\n  後でなければ処分できません。補助金事務局は、財産処分を承認した補助事業者に対し、当該承認に\n  際し、残存簿価等から算出される金額の返還のため、交付した補助金の全部または一部に相当する金\n  額を納付させることがあります。承認を得ずに処分を行うと、交付規程違反により補助金交付取消・返\n  還命令（加算金付き）の対象となります。\n\n（9）交付申請書の記入にあたっては、消費税等仕入控除税額を減額して申請しなければなりません。\n  課税事業者の場合、消費税および地方消費税相当額をあらかじめ補助対象経費から減額しておくこ\n  ととします。詳細は後日公開する別紙「参考資料」をご参照ください。\n\n（10）補助事業関係書類は事業終了後 5 年間保存しなければなりません。\n  補助事業者は、補助事業に関係する帳簿および証拠書類を補助事業の終了日の属する年度の終了\n  後 5 年間、補助金事務局等や独立行政法人中小企業基盤整備機構（以下、「中小機構」という。）、国\n  の補助金等の執行を監督する会計検査院からの求めがあった際に、いつでも閲覧に供せるよう保存\n  しておかなければなりません。\n  この期間に、会計検査院等による実地検査等が実施される可能性もあり、補助金の交付を受けた者の\n  義務として応じなければなりません。また、検査等の結果、仮に、補助金の返還命令等の指示がなされ\n  た場合には従わなければなりません。\n  また、「中小企業の会計に関する基本要領」または「中小企業の会計に関する指針」に拠った信頼性の\n  ある計算書類等の作成および活用に努めてください。中小企業の会計に関する基本要領等の詳細に\n  ついては、後日公開する別紙「参考資料」をご参照ください。\n\n\n\n                        25\n\n\n--- ページ区切り ---\n\n（11）補助事業実施後の「事業効果等状況報告」のご提出が必要です。\n  補助事業者は、補助事業終了から 1 年後の状況について、交付規程第 29 条に定める「事業効果等\n  状況報告」を、補助事業実施後、補助金事務局が指定する期限までに必ず行うことが必要です。提出\n  していない事業者、および提出が完了してから 1 年間が経過していない事業者には補助金申請に際\n  し、制限が課されます。詳細は「3．補助対象外となる事業者」をご確認ください。\n  また、補助金を活用して取り組む事業やその効果等を把握するためのアンケート調査等を実施する場\n  合がありますので、その際にはご協力をお願いいたします。ご提供いただいた情報は、統計処理を行\n  い、個人・個社を特定できない形で公表する可能性があります。\n\n（12）補助金は経理上、補助金の額の確定を受けた事業年度における収益として計上するものであり、法\n  人税・所得税の課税対象となります。\n\n（13）本公募要領や交付規程、ホームページ等の案内に記載のない細部については、補助金事務局から\n  の指示に従うものとします。\n\n（14）補助事業における実施状況の確認や、処分制限財産等の適正な管理、事業実施による効果を確認\n  するため、補助金事務局等及び中小機構が証憑提出を求めたり、電話連絡や訪問を実施したりするこ\n  とがあります。\n\n（15）補助金事務局等に提出された個人情報は、補助金交付元である国および中小機構と共有します。\n  また、以下の目的のために使用します。\n   ①補助金事業の適正な執行のために必要な連絡\n   ②経営活動状況等を把握するための調査（事業終了後のフォローアップ調査含む）\n   ③各種事業に関するお知らせ\n   ④国および中小機構による政策立案を目的としたエビデンスとしての活用\n   ⑤その他補助金事業の遂行に必要な活動\n\n（16）補助事業により取得した機械装置等は、取得財産等管理台帳を含め、備品台帳等を作って整備し\n  てください。また、機械装置等は、納品前（据付前）と納品後（据付後）の写真を撮っておいてください。\n  他の機械装置等に組み込まれる場合は、その状況がわかるように写真を撮っておいてください。\n  ①購入物件ごとの納品前後の写真及び送付伝票の写真を撮る\n  ②補助対象物件及び付属品に「第 20 回持続化」の表示を行う（シール、マジック等）\n\n\n11.申請に必要な書類\n\n1．申請者が必須の提出書類\n                   書類名                 法人   個人   NPO   種別   ※\n    次の内容は申請システムに直接入力します（添付の必要はありません）                        フ\n    ・持続化補助金事業に係る申請書（様式 1）                                   ァ\n    ・経営計画兼補助事業計画①（様式 2）                                     イ\n1                                      ○    ○    ○     ―    ル\n    ・補助事業計画②（様式 3）\n    ・補助金交付申請書（様式 5）                                         名\n    ・宣誓・同意書（様式 6） される場合があります。\n\n 審査の観点\n     Ⅰ.基礎審査\n\n\n\n                                32\n\n\n--- ページ区切り ---\n\n次の要件を全て満たすものであること。要件を満たさない場合には、その提案は失格とします。\n①必要な提出資料がすべて提出されていること\n②「2．補助対象者」(Ｐ.4)・「4．補助対象事業」(Ｐ.6) ・「6．補助率、補助上限額等」(Ｐ.7)・「7．補助\n 対象経費」（P.11）の要件及び記載内容に合致すること\n③補助事業を遂行するために必要な能力を有すること\n④小規模事業者が主体的に活動し、その技術やノウハウ等を基にした取組であること\n\nⅡ.計画審査\n経営計画・補助事業計画について、以下の項目に基づき加点審査を行い、総合的な評価が高いものか\nら順に採択を行います。\n①自社の経営状況分析の妥当性\n ○自社の経営状況を適切に把握し、自社の製品・サービスや自社の強みや弱みも適切に把握してい\n  るか。\n②経営方針・目標と今後のプランの適切性\n ○経営方針・目標と今後のプランは、自社の強みや弱みを踏まえており、売上高・売上総利益の増加\n  を目指すものとなっているか。\n ○経営方針・目標と今後のプランは、対象とする市場（商圏）や顧客のニーズを捉えたものとなってお\n  り、売上高・売上総利益の増加を目指すものとなっているか。\n③補助事業計画の有効性\n ○補助事業計画の効果は客観的事実に基づいて目標の設定がされており、売上高・売上総利益の増加\n  を目指すものとなっているか。\n ○補助事業計画は具体的かつ客観的事実に基づいており、当該小規模事業者にとって実現可能性が高\n  いものとなっているか。また、販路開拓を通じて売上高・売上総利益の増加を目指すものとして、経営\n  計画の今後の方針・目標を達成するために必要かつ有効なものか。\n ○補助事業計画には、技術やノウハウ、アイディアに基づき、ターゲットとする顧客や市場にとって、新\n  たな価値を生み出す商品、サービス、又はそれらの提供方法を有しており、客観的事実に基づい\n  た売上高・売上総利益の増加を見込める取組となっているか。\n ○補助事業計画には、デジタル技術を有効的に活用する取組が見られるか。\n ○補助事業により取得した資産について、補助事業終了後も継続して使用し事業展開に役立てるこ\n  とが明確になっているか。\n④積算の透明・適切性\n ○補助事業計画に合致した事業実施に必要なものとなっているか。\n ○事業費の計上・積算が正確・明確で、真に必要な金額が計上されているか。\n※過去、中小企業生産性革命推進事業にて実施した「小規模事業者持続化補助金」で採択を受けて\n 補助事業を実施した事業者については、全体を通して、それぞれ実施回の事業実施結果を踏まえた\n 補助事業計画を作成できているか、過去の補助事業と比較し、明確に異なる新たな事業であるか、\n といった観点からも審査を行います。\n※より多くの事業者に補助事業を実施いただけるよう、過去の補助事業（全国対象）の実施回数等に\n 応じて段階的に減点調整を行います。\n\nⅢ．加点審査\n政策的観点から加点審査を行います。加点は、【重点政策加点】、【政策加点】からそれぞれ 1 種類、合\n計 2 種類まで選択することができます。\n※【重点政策加点】、【政策加点】から 2 種類以上を選択された場合には、加点審査の対象となりませ\n\n\n\n                           33\n\n\n--- ページ区切り ---\n\n んので、お間違えのないようご注意ください。\n\n【重点政策加点】\n\n① 赤字賃上げ加点\n 賃金引上げ特例に申請する事業者のうち、赤字である事業者（P.11 の「業績が赤字の事業者に対\n する追加要件」をご確認ください）に対して、採択審査時に政策的観点から加点（＝赤字賃上げ加\n 点）を行います。\n\n ＜必要な手続＞\n✓ 賃金引上げ特例（赤字事業者）を希望した場合に、自動的に適用されます。\n  ※政策加点の賃金引上げ加点も自動的に適用されます。\n\n\n②事業環境変化加点\n ウクライナ情勢や原油価格、LP ガス価格等の高騰、米国による相互関税の影響を受けている事\n 業者に対して、採択審査時に政策的観点から加点（＝事業環境変化加点）を行います。\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「2．事業環境変化加点」を選択。\n✓ 希望する特例及び加点項目（様式 2）に物価高騰等の影響を受けている内容を入力。\n\n\n③東日本大震災加点\n 東京電力福島第一原子力発電所の影響を受け、引き続き厳しい事業環境下にある事業者に対し\n て、政策的観点から加点（＝東日本大震災加点）を行います。\n○東京電力福島第一原子力発電所の事故により避難指示等の対象となった福島県 12 市町村（田\n 村市、南相馬市、川俣町、広野町、楢葉町、富岡町、川内村、大熊町、双葉町、浪江町、葛尾村及\n び飯舘村）に補助事業実施場所が所在する事業者に対して採択審査時に政策的観点から加点\n （＝東日本大震災加点）を行います。\n○東京電力福島第一原子力発電所における ALPS 処理水の処分に伴う風評影響を克服するた\n め、新たな販路開拓等に取り組む太平洋沿岸部（北海道、青森県、岩手県、宮城県、福島県、茨城\n 県及び千葉県）に所在する水産仲買業者及び水産加工業者\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「3-1．東日本大震災加点（福島県 12 市町村）」もしく\n  は「3-2．（太平洋沿岸部に所在する水産仲買業者及び水産加工業者）」を選択。\n✓ 食品衛生法に基づく営業許可証もしくは届出書（受領印押印済み）の写しを提出。\n ※原則、魚介類販売業、魚介類競り売り営業、水産製品製造業、複合型冷凍製品製造業の許可\n  を得た事業者のみが対象です。ただし、食品衛生法の改正前における魚介類販売業、魚介類\n  競り売り営業、魚肉練り製品製造業、食品の冷凍又は冷蔵業について許可を受けた事業者\n  で、現法においても有効な許可を得ている事業者についても対象とします。\n\n\n④くるみん・えるぼし加点\n 次世代育成支援対策推進法（次世代法）に基づく「くるみん認定」を受けている事業者、もしくは女\n 性の職業生活における活躍の推進に関する法律（女性活躍推進法）に基づく「えるぼし認定」を受け\n ている事業者に対して、採択審査時に政策的観点から加点（＝くるみん・えるぼし加点）を行いま\n す。\n\n\n                         34\n\n\n--- ページ区切り ---\n\n    政策加点の⑥一般事業主行動計画策定加点にも該当し選択されている場合は、重点政策加点分\n    のみ加点されますのでご注意ください。\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「4．くるみん・えるぼし加点」を選択。\n✓ 基準適合一般事業主認定通知書の写しを提出。\n\n⑤ 健康経営優良法人加点\n  健康経営に関し、特に優良な取組を実践しているとして「健康経営優良法人」の認定を受けている\n  事業者に対して、採択審査時に政策的観点から加点（＝健康経営優良法人加点）※を行います。\n\n    ＜必要な手続＞\n✓   希望する特例及び加点項目（様式２）の「５．健康経営優良法人加点」を選択。\n\n※本加点は、G ビズ ID に登録された情報と「健康経営優良法人」の認定情報を基に自動判定しま\n す。G ビズ ID の登録情報に不備や未連携がある場合でも、個別対応は行いませんので、申請前\n に登録内容をご確認ください。\n\n\n【政策加点】\n\n① 賃金引上げ加点\n 最低賃金の引上げが行われる中、それに加えて更なる賃上げを行い、従業員に成長の果実を分配\n する意欲的な小規模事業者に対し政策支援をするため、2027 年 4 月 1 日から補助事業実施期\n 限日（2028 年 3 月 31 日（金））までの期間と前年同月の 12 ヶ月を比べ、従業員（非常勤を含む。\n 代表者、役員及び専従者は含めない。以下同じ。）1 人あたり給与支給総額が年平均 2.0％以上増\n 加した事業者に対し、採択審査時に政策的観点から加点（＝賃金引上げ加点）を行います。\n    補助事業終了予定日は補助事業実施期限日（2028 年 3 月 31 日（金））に設定してください。\n    具体的には、申請者自身で 1 人あたり給与支給総額を年平均 2.0％以上引き上げる目標値（以下\n    「1 人あたり給与支給総額目標値」という。）を設定し（※1）、交付申請時までに全ての従業員又は\n    従業員代表者、役員に対して表明のうえ、実績報告時点において 1 人あたり給与支給総額目標値\n    を達成することが必要です。\n    本要件を満たさない場合は、交付決定後であっても、補助金は交付されません。\n※1：1 人あたり給与支給総額の算出に含める従業員は、賃金引上げの比較対象期間である「補助事業\n 実施期限日を終点とした連続する 12 か月」および「その前年同月の１２か月」の各期間にて、全月分\n の給与等の支給を受けた従業員とします。いずれかの期間において全月分の給与等の支給を受け\n ていない従業員は、当該期間の算出対象から除外します。中途採用や退職等で全月分の給与等の\n 支給を受けていない従業員については、算出の対象から除く必要があります。 各時点において、産\n 前・産後休業、育児休業、介護休業など事業者の福利厚生等により時短勤務を行っている従業員は\n 算出対象から除くことができます。なお、パートタイム従業員については、正社員の就業時間に換算\n して人数を算出してください。昇給や減給、残業時間等の増減等により給与変動がある従業員も 1\n 人あたり給与支給総額の年平均上昇率の算出対象となります。あらかじめこれらの要因も考慮した\n うえで算出してください。\n（注）年平均とは連続する１２か月の平均のことを指します。\n（注）パートタイム従業員は正社員の就業時間に換算した人数となりますので、例えば、正社員の就業\n\n\n\n                           35\n\n\n--- ページ区切り ---\n\n   時間が 1 日 7 時間・週 35 時間の事業者において 1 日 3 時間・週 15 時間勤務のパートタイム従\n   業員は、0.42 人（3÷7 の小数点以下第 3 位を切捨て）として計算します。\n（注）給与支給総額とは、従業員に支払った給与等（給料、賃金、残業代、賞与等は含み、福利厚生費や\n   法定福利費、退職金は除く）をいいます。また、1 人あたり給与支給総額とは、給与支給総額を従\n   業員数で除したものをいいます。詳しくは、後日公開する別紙「参考資料」を参照してください。\n（注）本加点における「従業員」は、申請要件である「常時使用する従業員」とは異なります。\n（注）賃金引上げの比較対象期間（補助事業実施期限日を終点とする１２か月およびその前年同月の\n   12 か月）の各期間にて、いずれかの月で算定対象となる従業員が存在しない場合は、1 人あたり\n   給与支給総額を算出できないため、本特例の対象外となります。\n（注）申請時点では要件を満たしている場合であっても、実績報告時までに従業員がいなくなる等によ\n   り、1 人あたり給与支給総額の年平均上昇率を算出できなくなった場合は、補助金は交付されませ\n   ん。\n\n ＜申請時の必要な手続＞\n✓ 希望する特例及び加点項目（様式２）の「１．賃金引上げ加点」を選択。\n✓ 宣誓・同意画面に表示される「賃金引上げ特例・賃金引上げ加点の申請に係る誓約・同意書」（様\n  式７）を確認し、該当箇所にチェック。\n\n ＜採択後交付決定までに必要な手続＞\n✓ 「給与支給総額基準値算出表」画面にて、1 人あたり給与支給総額基準値の算定に必要な情報\n  （給与支給総額、従業員数等）を入力し、1 人あたり給与支給総額目標値を設定してください。\n✓ 労働基準法に基づく、採択発表日の属する月を終点とした連続する１２か月分の賃金台帳（※1）\n  の写し（※2）\n✓ 雇用条件（1 日の所定労働時間、年間休日）が記載された書類の写し（※2）。 例）雇用契約書、労\n  働条件通知書等\n\n ＜実績報告時の必要な手続＞\n✓ 補助事業実施期限日を終点とした連続する１２月か分の、労働基準法に基づく賃金台帳（※1）の\n  写し（※2）。\n✓ 賃金引上げ後の雇用条件（1 日の所定労働時間、年間休日）が記載された書類の写し（※2）。\n  例）雇用契約書、労働条件通知書等\n ※１：労働基準法に基づく賃金台帳は、後日公開する別紙「参考資料」をご参照ください。\n ※２：役員、専従者従業員を除く全従業員分の提出が必要です。\n\n\n②地方創生型加点\n 以下の類型に即した事業計画を策定している事業者に対して、政策的観点から加点を行います。\n\n ○地域資源型\n  地域資源等を活用し、良いモノ・サービスを高く提供し、付加価値向上を図るため、地域外への販\n  売や新規事業の立ち上げを行う計画\n\n ○地域コミュニティ型\n  地域の課題解決や暮らしの実需に応えるサービスを提供する小規模事業者による、地域内の需\n  要喚起を目的とした取組等を行う計画\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「2-①．地方創生型加点（地域資源型）」もしくは「2-②．\n\n\n\n                           36\n\n\n--- ページ区切り ---\n\n    地方創生型加点（地域コミュニティ型）」を選択。\n✓   希望する特例及び加点項目（様式 2）に上記の取組を行う計画を入力。\n\n③経営力向上計画加点\n 各受付締切回の基準日（詳細は後日公開する別紙「参考資料」を参照）までに、中小企業等経営強\n 化法に基づく「経営力向上計画」の認定を受けている事業者に対して、採択審査時に政策的観点か\n ら加点（＝経営力向上計画加点）を行います。\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「3．経営力向上計画加点」を選択。\n✓ 「認定書」の写しを提出（「認定書」の写しの提出がない場合は、加点対象になりません）。基準日ま\n  でに認定を受けていることが必要です。基準日よりも後に認定を受けた事業者や、認定申請中の\n  事業者は対象となりません。\n\n④事業承継加点\n 各受付締切回の基準日（詳細は後日公開する別紙「参考資料」を参照）時点の代表者の年齢が満\n 60 歳以上の事業者で、かつ、後継者候補が補助事業を中心になって行う場合、採択審査時に政\n 策的観点から加点（＝事業承継加点）を行います。\n\n  ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「4．事業承継加点」を選択。\n✓ 希望する特例及び加点項目（様式 2）の事業承継の計画について入力および選択。\n✓ 代表者の生年月日が確認できる公的書類（自動車運転免許証等）の写しを提出。\n✓ 後継者候補の実在確認書類を提出。\n（ア）会社で「他の役員（親族含む）」の場合、「現在事項全部証明書または履歴事項全部証明書」（申請\n   書の提出日から 3 か月以内の日付のもの・原本）又は、役員に就任していることが分かる書類の\n   写し。\n（イ）会社または個人事業主で「従業員（親族含む）」の場合、当該従業員にかかる「雇用契約書」の写\n   し、又は、当該従業員を雇用していることが分かる書類の写し。\n（ウ）個人事業主で「家族専従者」の場合、必須の提出書類である「確定申告書または青色申告決算\n   書」において専従者であることが確認可能なら、追加資料は不要。\n（エ）上記の(ア)～(ウ)以外の場合、実在確認用の公的書類（本人の運転免許証の写しや住民票等）。\n✓ 代表者が地域の商工会・商工会議所とご相談の上で商工会・商工会議所が作成・交付する「事業\n   承継診断票」（様式 10）を提出。\n   ※地域の商工会・商工会議所への「様式 10」発行依頼は、「事業支援計画書」（様式 4）発行依頼と\n    同時に行ってください。\n   ※前回までの申請の際に「事業承継診断票」（様式 10）の作成・交付を受けた場合でも、今回、改\n    めて「様式 10」の作成・交付が必要です（前回分の再利用は不可）。\n\n⑤過疎地域加点\n 過疎地域という極めて厳しい経営環境の中で販路開拓等に取り組む事業者を重点支援する観点\n から、「過疎地域の持続的発展の支援に関する特別措置法」に定める過疎地域に所在し、地域経済\n の持続的発展につながる取組を行う事業者に対して、採択審査時に政策的観点から加点（＝過疎\n 地域加点）を行います。\n\n    ＜必要な手続＞\n\n\n\n                        37\n\n\n--- ページ区切り ---\n\n✓ 希望する特例及び加点項目（様式 2）の「5．過疎地域加点」を選択。\n\n⑥一般事業主行動計画策定加点\n 従業員 100 人以下の事業者で「女性の活躍推進企業データベース」に女性活躍推進法に基づく一\n 般事業主行動計画を公表している事業者、もしくは従業員 100 人以下の事業者で「両立支援のひ\n ろば」に次世代法に基づく一般事業主行動計画を公表している事業者に対して、採択審査時に政\n 策的観点から加点（＝一般事業主行動計画策定加点）を行います。\n 計画期間に「公募締切日」及び「事業者が設定した補助事業終了予定日」がいずれも含まれている\n 場合に加点の対象となります。\n 重点政策加点の④くるみん・えるぼし加点にも該当し選択されている場合は、重点政策加点分のみ\n 加点されますのでご注意ください。\n ※厚生労働省「女性の活躍推進企業データベース」\n （https://positive-ryouritsu.mhlw.go.jp/positivedb/search_int）\n ※厚生労働省「両立支援のひろば」\n （https://ryouritsu.mhlw.go.jp/hiroba/search_int.php）\n\n＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「6．一般事業主行動計画策定加点」を選択。\n✓ 希望する特例及び加点項目（様式 2）に、自社で策定した一般事業主行動計画が掲載されている、\n  厚生労働省「女性の活躍推進企業データベース」または「両立支援のひろば」の URL を入力。\n\n⑦後継者支援加点\n 将来的に事業承継を行う予定があり、新たな取組を行う後継者候補として、「アトツギ甲子園」のファ\n  イナリスト等になった事業者を対象に政策支援をするため、以下の要件を満たす事業者に対して加\n  点を行います。\n 申請時において、「アトツギ甲子園（※1）」のファイナリスト又は準ファイナリスト（※2）になった事業\n 者であること。\n ※1：詳細は後日公開する別紙「参考資料」をご参照ください。\n ※2:準ファイナリストとは、地方予選大会出場者のうち、ファイナリスト以外であって、特に優秀と認\n   められ、経済産業省ＨＰで公表された者。\n （注）過去の持続化補助金の「後継者支援枠」で採択され事業を実施した事業者は、対象外です。た\n   だし異なる年度において、上記要件を満たす場合は、補助対象となり得ます。\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「7．後継者支援加点」を選択。\n✓ 希望する特例及び加点項目（様式 2）に選出された年度を入力。\n\n⑧小規模事業者卒業加点\n 事業規模拡大に意欲的な小規模事業者に対し政策支援をするため、補助事業実施期間中に常時\n 使用する従業員を増やし、小規模事業者として定義する従業員の枠を超え事業規模を拡大する事\n 業者に対して加点を行います。\n 補助事業の終了時点において、常時使用する従業員の数（※1）が小規模事業者として定義する従\n 業員数を超えていること（※2）。ただし、この要件を満たさない場合は、交付決定後であっても、補\n 助金の交付は行いません。\n ※1：常時使用する従業員の考え方は、「2.補助対象者」（P.4）をご参照ください。\n\n\n\n                            38\n\n\n--- ページ区切り ---\n\n ※2：小規模事業者として定義する従業員を超えた数\n (注)過去の持続化補助金の「卒業枠」及び「卒業加点」で採択され事業を実施した事業者は、今後、\n    本補助金の対象となりません。\n\n      業種                                           常時使用する従業員の数\n      商業・サービス業（宿泊業・娯楽業除く）                          6 人以上\n      サービス業のうち宿泊業・娯楽業                              21 人以上\n      製造業その他                                       21 人以上\n ＜申請時に必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「8.小規模事業者卒業加点」を選択。\n✓ 宣誓・同意画面に表示される「小規模事業者卒業加点の申請に係る誓約・同意書（様式 8）」を確\n  認し、該当箇所にチェック。\n✓ 労働基準法に基づく最新の労働者名簿（常時使用する従業員分のみ）（※1）を提出。\n ＜実績時に必要な手続＞\n✓ 補助事業終了時点における、労働基準法に基づく最新の労働者名簿（常時使用する従業員分の\n  み）（※1）を提出。\n  ※1：労働基準法に基づく労働者名簿の記載事項は、後日公開する別紙「参考資料」をご参照くだ\n   さい。\n\n⑨事業継続力強化計画策定加点\n 申請受付締切日までに、中小企業等経営強化法に基づく「事業継続力強化計画」または「連携事業\n 継続力強化計画」の認定を受けており、実施期間が終了していない認定事業者に対して、採択審査\n 時に政策的観点から加点（＝事業継続力強化計画策定加点）を行います。\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「9．事業継続力強化計画策定加点」を選択。\n✓ 受付番号（※1）、実施期間開始期及び終期を入力。申請受付締切日までに認定を受けており実施\n  期間が終了していないことが必要です。締切日よりも後に認定を受けた事業者や、認定申請中の\n  事業者、実施期間が終了している事業者は対象となりません。\n\n  ※1：事業継続力強化計画電子申請システムの受付番号の確認方法は以下でご確認ください。半\n       角数字 10 桁の番号（000・・・）が受付番号ですので、お間違いないようご注意ください。\n  ※事業継続力強化計画（電子申請）における「受付番号」の確認方法\n https://www.chusho.meti.go.jp/keiei/antei/bousai/download/keizokuryoku/shinsei_bangou.pdf\n\n\n⑩令和 6 年能登半島地震等に伴う加点\n 令和 6 年能登半島地震等に起因して、自社の事業用資産に損壊等の直接的な被害（直接被害）や\n 売上減少の間接的な被害（間接被害）を受けた事業者に対し、政策的観点から加点を行います。\n ※「小規模事業者持続化補助金＜一般型 災害支援枠（令和６年能登半島地震等）＞（＜災害支援\n  枠（令和 6 年能登半島地震）＞含む。）」において、既に採択を受けて補助事業を実施している場\n  合、本加点の対象外です。ただし、地震により被害を受けた小規模事業者等が採択を受けて補助\n  事業を実施した場合には、豪雨被害での令和 6 年能登半島地震等に伴う加点の選択は可能で\n  す。\n ※「小規模事業者持続化補助金＜一般型 災害支援枠（令和 6 年能登半島地震等）＞」に申請中\n  の場合は令和 6 年能登半島地震等に伴う加点の選択はできません。\n\n\n\n                                          39\n\n\n--- ページ区切り ---\n\n 【直接被害の場合】\n 〇石川県、富山県、新潟県、福井県内に補助事業の実施場所が所在し、かつ、地震被害または豪雨\n   被害に伴う自社の事業用資産に損壊等の直接的な被害を受けたことが地方自治体により発行さ\n   れた証明書等により確認できる事業者については、政策的観点から加点（令和 6 年能登半島地\n   震等に伴う加点）を行います。\n\n\n 【間接被害の場合】\n 〇石川県、富山県、新潟県、福井県内に補助事業の実施場所が所在し、かつ、地震被害の場合、令\n   和 6 年 1 月から令和 8 年 11 月までの任意の 1 か月間の売上、または、豪雨被害のみの場合、\n   令和 6 年 9 月から令和 8 年 11 月までの任意の 1 か月間の売上が前年同期または令和 2 年 1\n   月２８日以前の同期と比較して 20％以上減少したことが、地方自治体により発行された証明書\n   等により確認できる事業者については、政策的観点から加点（＝令和 6 年能登半島地震等に伴\n   う加点）を行います。\n\n  ＜必要な手続＞\n✓ 希望する加点項目（様式 2）の「10.令和 6 年能登半島地震等に伴う加点」を選択。\n✓ 【直接被害の場合】\n   市町村が発行する事業所等が罹災されたことが分かる公的書類（令和６年能登半島地震等による\n   罹災（被災）証明書等）の写しを提出。\n   ※ファイル名を「被害の証明書（事業者名）」にしてご提出ください。\n   ※原則、証明書の名義は事業者名であること\n✓ 【間接被害の場合】\n  地震被害の場合は令和 6 年 1 月から令和 8 年 11 月までの任意の 1 か月間の売上、または豪雨\n  被害のみの場合は令和 6 年 9 月から令和 8 年 11 月までの任意の 1 か月間の売上が前年同期\n  または令和 2 年 1 月 28 日以前の同期と比較して 20％以上減少を行政機関が証した書面（例：\n  セーフティネット保証 4 号の認定書や、地方自治体が独自に発行した証明書等）の写しを提出。\n   ※ファイル名を「売上減少の証明書（事業者名）」にしてご提出ください。\n   ※原則、証明書の名義は事業者名であること\n\n⑪地域別最低賃金引上げ加点\n すでに実施された地域別最低賃金の改定において、直近からひとつ前の改定以降直近の改定まで\n の期間で、直近の改定での地域別最低賃金額未満で雇用していた従業員（連続した３か月以上）が\n いる事業者に対して、政策的観点から加点（地域別最低賃金引上げ加点）を行います。\n ※直近の改定の際、改定前から事業場内最低賃金が改定後の地域別最低賃金以上となっていた\n   場合は、本加点の対象外です。\n\n 【対象期間（連続した 3 か月）の考え方 例】\n  ●所在する地域が申請受付開始日時点で当年の最低賃金改定済の場合\n   前年の最低賃金改定後から当年の改定前までの期間のうち、連続する 3 か月\n\n  ●所在する地域が申請受付開始日時点で当年の最低賃金未改定の場合\n   前々年の最低賃金改定後から前年の改定前までの期間のうち、連続する 3 か月\n\n ＜必要な手続＞\n✓ 希望する特例及び加点項目（様式 2）の「１１．地域別最低賃金引上げ加点」を選択。\n\n\n                          40\n\n\n--- ページ区切り ---\n\n  ✓ 「地域別
