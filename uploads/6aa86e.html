<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウェビナー制作ヒアリングフォーム</title><style>
body{margin:0;background:#fff;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7}.wrap{max-width:960px;margin:auto;padding:28px 16px 90px}h1{font-size:26px;color:#172a46;margin:0 0 22px}h2{font-size:20px;color:#fff;background:#172a46;border:0;padding:9px 14px;margin:34px 0 14px}.card{background:#fff;border:1px solid #c8d0da;border-radius:0;padding:18px;margin:16px 0}.field{margin:18px 0}.field label{display:block;font-weight:700;color:#1f2933}.help{font-size:13px;color:#5d6875;margin:3px 0 7px}.field textarea{width:100%;min-height:88px;box-sizing:border-box;border:1px solid #9da9b8;border-radius:0;padding:10px;font:inherit;background:#fff}.note{padding:9px 14px;margin:16px 0;color:#fff;background:#8b1e2d}.actions{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid #c8d0da;padding:12px 0;display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:0;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#172a46;color:#fff}.secondary{background:#e7ebef;color:#1f2933}.status{font-size:13px;color:#5d6875;align-self:center}
 .actions{z-index:2000!important;position:sticky}
</style></head><body><main class="wrap"><h1>ウェビナー制作ヒアリングフォーム</h1><div class="card">以前一緒に作った台本の見出し順で入力する。AI専用の固定項目ではない。各欄の下に、何を書くかを説明している。空欄でも台本MDは生成できる。</div><div class="note"><strong>共感から原因へ</strong><br>ここにいるということはきっと… → でも現実は… → 実は私もそうでした → ぶっちゃけ… → なぜうまくいかないのか → 本当の問題は？ → 解決策へ</div><form id="form"></form><button class="secondary" id="addStep" type="button">＋ステップを追加（ステップ4・5以降）</button><button class="secondary" id="addProductContent" type="button">＋商品内容を追加</button><div class="actions"><button class="primary" id="save" type="button">入力を保存</button><button class="primary" id="make" type="button">台本MDを生成</button><button class="secondary" id="json" type="button">JSON保存</button><span class="status" id="status">未保存</span></div></main><script>
const sections=[
['0. タイトル・自己紹介', [['webinar_name','ウェビナー名','正式名称を書く。'],['title_call','タイトルコール（タイトル）','「〇〇しないで、〇〇する方法」など、参加者が内容をイメージできるタイトル例を書く。'],['who_i_am','私は誰か','なぜ見込み客があなたの話を聞くべきなのか、あなたに話す権威があるのかを書く。実績・経験・現在の仕事は、その根拠として書く。'],['goal','本日のゴール','回答や手順ではなく、このウェビナーで何が分かるようになるのかを書く。何が分かるかをゴールにすると、次の内容につなげやすい。'],['flow','本日の流れ','目次・アジェンダとして、扱う順番を見出しで書く。']]],
['1. 共感', [['here_because','ここにいるということはきっと…','見込み客が「もし、こうなったら」と期待している状態を書く。参加した理由とつながるようにする。<br>（例：雑務を減らして本業に専念したい。AIを有効活用したい。自分と同じ思想を持つ参謀が何人もいたらいい、など）'],['but_reality','でも現実は…','期待と裏腹に起きている現実、困っていること、期待どおりになっていない例を書く。できれば感情が動く具体例も入れる。<br>（例：AIを導入したのに一向に楽にならない。指示した内容を具現化してくれない。AIっぽさが消えない。自分が倒れたら終わり。いくら頑張っても、稼いでも稼いでも、一向に楽にならない、など）'],['me_too','実は私もそうでした','主催者自身の経験だけでなく、顧客の情報や顧客の声でもよい。「あなたの気持ちを分かっています」と伝わる材料を書く。人は共感してくれる人の話を聞くため、このパートを置く。<br>（例：AIを使えば使うほど帰宅時間が遅くなる。コストが増える。ストレスが増える。実は私もそうでした、など）'],['frankly','ぶっちゃけ、なんのためにやっているのかわからないですよね。','感情を揺さぶるパート。遠慮せず、見込み客の疲れ・怒り・不安・虚しさなどの感情を思い切り言葉にする。<br>（例：ぶっちゃけ、なんのためにやっているのかわからないですよね、など）']]],
['2. なぜうまくいかないのか？', [['why_not_work','なぜうまくいかないのか？','今のやり方のどこで問題が起きているのかを説明する。見込み客を責めず、次の「よくある原因」と問題①〜③につなげる。<br>（例：プロンプトエンジニアリングがAIの動きを止めている、など）'],['common_cause','よくある原因','「よくある〇〇が原因」と言える、一般的に起きている原因を書く。見込み客が今やっていることが、うまくいかない原因になっている可能性を示す。必要な場合だけ追加する。<br>（例：プロンプトを作り込めば、AIはうまく動くと思っていることが原因、など）'],['problem1','問題①','ある場合だけ書く。最初の具体的な問題。<br>（例：AIがすべての文字を読むわけではない、など）'],['problem2','問題②','ある場合だけ書く。次の具体的な問題。<br>（例：読んでくれないので、背景情報が不足してしまう、など）'],['problem3','問題③','ある場合だけ書く。最後の具体的な問題。<br>（例：プロンプト指示に忠実になろうとして、根本を見失うことがある、など）'],['true_problem','本当の問題は？','問題①〜③をまとめた、より大きな問題を書く。多くの人が「レベルを上げれば」「技術を磨けば」「いい商品を作れば」「認知されれば」うまくいくと考えるが、本当は問題の置き場所や構造そのものが違う、というパラダイムシフトを書く。<br>（例：AIに知識を足すだけではなく、本人の視点で確認できるAIを含む組織を設計する必要がある、など）'],['true_problem_reason','なぜ本当の問題なのか','直前の「本当の問題は？」に書いた内容を受けて、なぜそれが本当の問題なのか、今の不具合や悩みを生んでいる理由を具体的に書く。'],['true_problem_evidence','証拠','本当の問題を裏付けるデータ、証拠、お客様の声、事例、失敗例などを書く。複数ある場合は、改行して一件ずつ追加する。データや証拠は、あればあるほどよい。']]],
['3. 解決策へ', [['question','では、どうすればいいのか？','必要な場合だけ書く。ここで止めてもよいが、現状を続けるしかないのかという迷いから、解決策へ切り替える流れを置く。<br>（例：やはり〇〇は無理なのか？　今まで通り粛々と頑張るしかないのか？　いいえ、そんなことはありません、など）'],['solution','解決策','本編で示す考え方・方法を書く。商品名ではなく、解決策そのものを書く。<br>（例：AIクローン生成講座ではなく、AI組織設計、など）'],['solution_definition','解決策とは','上の「解決策」に書いた内容を、初めて聞く人にも意味が分かるように説明する。<br>（例：一つのAIに任せず、実行AI・監査AI・なりきりAIなど、役割を持ったAI組織として動かす設計）'],['why_solution','なぜ解決策なのか','本当の原因を解消し、今のやり方で残っていた負担やズレに直接効く理由を書く。<br>（例：実行AIが作成し、監査AIが確認し、なりきりAIが本人基準で判定する受け渡しを設計できる、など）'],['solution_case','解決策の事例','Before・After・数字・出典を書く。<br>（例：事業計画書の作成が10時間から15分になった。ブレイン活用の採択率100％、など）'],['solution_visual','解決策の画像・図解案','解決策をイメージできる写真や図解を書く。']]],
['4. 本編のポイント', [['objection','顧客の反論','本編に入る前に出てくる顧客の不安や反論を書く。<br>（例：初めての私にもできますか？　でも、すごく時間がかかるんじゃないですか？　でも、すごくお金がかかるんじゃないですか？　など）'],['my_story','マイストーリー','主催者自身が経験したことを書く。どんな人間なのか、なぜそう考えるのかを伝え、親近感と共感を持ってもらうためのパート。ここで伝えた経験や考えを、次の「なぜ私がこれを広めているのか」につなげる。<br>（例：AIを使えば使うほど帰宅時間とストレスが増えた。だから、同じ悩みを持つ人に別の方法を伝えたい、など）'],['why_share','なぜ私がこれを広めているのか','マイストーリーで伝えた経験や考えを受けて、主催者がこのテーマを広めている理由を書く。AIを使う人が増えるほど負担が増える状況を、どう変えたいのかまで書く。<br>（例：AIを使う人が増えるほど負担が増える状況を、AI組織設計で変えたい、など）'],['difference','他との違い','一般的な方法と、このウェビナーで示す方法の違いを書く。<br>（例：プロンプトを作り込むだけでなく、役割を持つAI組織を設計する、など）'],['main_title','本編タイトル','本編全体を一言で表すタイトルを最初に書く。<br>（例：AI組織で成功する5ステップ、など）'],['step_outline','本編タイトルの下に置くステップ見出し','本編タイトルの下に置く見出しを、ステップ1〜5の順番で「ステップ1 〇〇」の形で書く。<br>（例：ステップ1 マインドセット／ステップ2 AIブレイン設計／ステップ3 AIエージェント構築／ステップ4 エージェント連携／ステップ5 メモリー・アーカイブ、など）'],['point1','ステップ1','ステップのタイトルと内容を書く。<br>（例：マインドセット、など）'],['point1_case','ステップ1の事例','このステップの事例を書く。<br>（例：事業計画書の作成時間を10時間から15分に短縮、など）'],['point2','ステップ2','ステップのタイトルと内容を書く。<br>（例：AIブレイン設計、など）'],['point2_case','ステップ2の事例','このステップの事例を書く。<br>（例：実行AI・監査AI・なりきりAIの役割設計、など）'],['point3','ステップ3','ステップのタイトルと内容を書く。<br>（例：AIエージェント構築、など）'],['point3_case','ステップ3の事例','このステップの事例を書く。<br>（例：実行AIが作成し、監査AIが確認する流れ、など）'],['point_visual','ポイントの画像・図解案','各ポイントの意味が伝わる構図を書く。<br>（例：ステップ1からステップ5までを流れで示す図、など）']]],
['4.5 次はあなたの番', [['transition','次はあなたの番','本編のポイントを聞いた参加者へ、自分も同じように変われると伝える。<br>（例：次はあなたの番です、など）'],['invitation','あなたも同じように成功しませんか？','成功事例を自分ごととして受け取れるように、参加者へ呼びかける。<br>（例：あなたもAI組織を使って、同じように成果を出しませんか？、など）'],['transition_visual','次のパートへのつなぎ','本編から商品紹介へ自然につなぐ一言を書く。<br>（例：ここから、その方法を実行するための支援をご紹介します、など）']]],['5. 商品紹介', [['product','商品・サービス名','解決策を実行・支援する商品を書く。解決策そのものではなく、解決策を選ぶ理由や商品のジャンルとつなげる。<br>（例：AIクローン生成習得講座、など）'],['for_who','誰のためのものか','見込み客が身につけたいこと、実現したい目標や期待を書く。属性を並べず、前向きな変化で書く。<br>（例：AI組織設計を身につけて本業に専念したい。もっと売上を伸ばしたい、など）'],['not_for_who','誰のためでないか','この方法が合わない考え方を、相手を責めずに明確にする。否定されたくない見込み客が自分で振り返り、必要な人が「自分はそうではない」と判断して、対象の欄へ戻れるようにする。<br>（例：楽して儲かればいいと思っている方。他人頼みで、何もしないで成果を得たいと思っている方。今の現状に十分満足している方。これ以上成長しなくてもいいと思っている方、など）'],['content1','内容1（見出しと説明）','商品の中身を一つずつ分け、見出しと説明を同じ欄に書く。<br>（例：AIブレイン設計｜自分の頭の中身をAIが実行できる設計にする、など）'],['value','得られる変化','商品を使った後の変化を書く。<br>（例：毎回一人のAIへ指示し直す負担を減らし、役割分担で仕事を進められる、など）']]],
['6. オファー', [['bonus1','特典1','特典名と、その価値（〇〇円相当）を必ず書く。見込み客が「本当にこの手段でいいのか」「自分にはできないのではないか」と感じている、手段と能力の両方への不安を払拭する内容として、できること・しなくて済むことを書く。<br>（例：AI組織設計テンプレート（30,000円相当）、組織設計の方法が分かり、自分でも手順に沿って進められる、など）'],['bonus1_voice','特典1に対する顧客の声','顧客の声がある場合だけ、別欄に書く。<br>（例：顧客が実際にできるようになったこと、など）'],['list_price','これはあなたにとってどれくらいの価値があるでしょうか？','商品内容と特典、それぞれの価値を書く。商品内容は〇〇円、特典1は〇〇円、特典2は〇〇円という形で並べる。<br>（例：商品内容100,000円、特典1 30,000円、特典2 20,000円、など）'],['bonus2','特典2','ある場合のみ。特典名と、その価値（〇〇円相当）、できることを書く。定価でも十分役に立ち、価値どおりだと思える内容であることを説明してから、定価を提示する。ない場合は「なし」。<br>（例：AIエージェント役割設計シート（20,000円相当）、定価でも十分役に立つ内容、など）'],['bonus2_voice','特典2に対する顧客の声','顧客の声があれば書く。なければ「なし」。<br>（例：顧客が実際に感じた価値、など）'],['price','今回は、この価格ではありません','定価や通常価格を示したうえで、今回提示する価格ではないことを書く。支払い条件も確定情報だけを書く。<br>（例：通常価格〇〇円。ただし、今回はこの価格ではありません、など）'],['offer_summary','ここまでのまとめ','内容・特典・通常価格相当をまとめた後、今回の価格を示す。オファーの流れで何度も使えるまとめパート。<br>（例：内容1 〇〇円相当、特典1 〇〇円相当、特典2 〇〇円相当。合計〇〇円相当のところ、今回は〇〇円、など）'],['regular_total','通常価格の合計','内容・特典の通常価格相当を合計して書く。<br>（例：合計100,000円相当、など）'],['offer_price','今回はこの価格','今回提示する価格を書く。<br>（例：今回は49,800円、など）'],['guarantee','保証・期限・定員','確定している条件だけを書く。<br>（例：申込期限、募集人数、返金条件、など）'],['apply_method','申し込み方法','参加者が実際に申し込む方法を書く。<br>（例：その場で申し込む、個別相談に申し込む、など）'],['two_paths','あなたには2つの道があります','参加者が選べる2つの道を示す。<br>（例：自分でやる道／私たちと一緒にやる道、など）'],['final_offer_summary','商品内容と価格のまとめ（最終確認）','2つの道を示した後、商品内容・通常価格の合計・今回の価格をもう一度まとめる。<br>（例：内容と特典の合計〇〇円相当、今回は〇〇円、など）'],['key_numbers','重要数字','価格・通常価格の合計・申込期限・定員など、最後に強調する数字をまとめる。<br>（例：合計〇〇円相当、今回は〇〇円、申込期限〇月〇日、定員〇名、など）'],['quote','格言・締めの一言','最後に伝える格言や締めの一言を書く。著名人の言葉を使う場合は、発言者と出典も書く。<br>（例：AIについての格言、発言者名、出典URL、など）'],['cta','CTA','参加者に一緒に進むことを呼びかけ、次に確認する場所を具体的に書く。<br>（例：一緒にやりましょう。個別相談で確認してください、など）']]],
['7. FAQ・最終確認', [['faq','よくある質問と回答','参加者が迷う質問と回答を書く。<br>（例：一人で使うAIと何が違うのか？への回答、など）'],['sources','参照資料・URL・ファイル','事実の根拠を書く。<br>（例：顧客の声、事業計画書作成10時間→15分の記録、参照URL、など）'],['unknown','未確認事項','誰が何を確認するかを書く。<br>（例：価格・実績・顧客の声の出典を主催者が確認、など）']]]
];
const form=document.querySelector('#form');for(const [title,fs] of sections){const s=document.createElement('section');s.className='card';s.dataset.title=title;s.innerHTML='<h2>'+title+'</h2>';for(const [key,label,help] of fs){const d=document.createElement('div');d.className='field';d.innerHTML='<label>'+label+'</label><div class="help">'+help+'</div><textarea data-key="'+key+'"></textarea>';s.appendChild(d)}form.appendChild(s)}
const pointsSection=[...document.querySelectorAll('section.card[data-title]')].find(x=>x.dataset.title==='4. 本編のポイント');const addStepButton=document.querySelector('#addStep');if(pointsSection&&addStepButton){pointsSection.appendChild(addStepButton);const hint=document.createElement('div');hint.className='help';hint.textContent='＋を押すと、ステップ4、ステップ5以降のタイトル・内容・事例欄を追加できます。';pointsSection.appendChild(hint)}const store='generic_webinar_hearing_v4';function vals(){return Object.fromEntries([...document.querySelectorAll('[data-key]')].map(x=>[x.dataset.key,x.value]))}function save(){localStorage.setItem(store,JSON.stringify(vals()));document.querySelector('#status').textContent='保存しました'}function dl(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click()}function make(){save();let out='# ウェビナー台本\n\n';document.querySelectorAll('.card[data-title]').forEach(s=>{out+='## '+s.dataset.title+'\n\n';s.querySelectorAll('[data-key]').forEach(x=>{const label=x.previousElementSibling.previousElementSibling.textContent;const value=x.value.trim()||'未回答：要確認';if(x.dataset.key==='step_outline'&&x.value.trim()){const items=x.value.split(/\n|／|\//).map(v=>v.trim()).filter(Boolean);items.forEach(item=>{out+='### '+item+'\\n\\n';});}else{out+='### '+label+'\\n\\n'+value+'\\n\\n';}});});out+='## 生成後の確認\n\n未回答・未確認の実績、価格、保証、期限、顧客の声は確定前に確認する。\n';dl('ウェビナー台本_生成.md',out,'text/markdown;charset=utf-8');document.querySelector('#status').textContent='台本MDを生成しました'}let nextContent=2;const addProductButton=document.querySelector('#addProductContent');const productSection=[...document.querySelectorAll('section.card[data-title]')].find(x=>x.dataset.title==='5. 商品紹介');if(productSection&&addProductButton){productSection.appendChild(addProductButton);const hint2=document.createElement('div');hint2.className='help';hint2.textContent='＋を押すと、内容2、内容3以降の見出しと説明欄を追加できます。';productSection.appendChild(hint2)}addProductButton.onclick=()=>{const n=nextContent++;const addProductField=(key,label,help)=>{const d=document.createElement('div');d.className='field';d.innerHTML='<label>'+label+'</label><div class="help">'+help+'</div><textarea data-key="'+key+'"></textarea>';productSection.insertBefore(d,productSection.querySelector('[data-key="for_who"]').parentElement)};addProductField('content'+n,'内容'+n+'（見出しと説明）','商品の中身の見出しと説明を同じ欄に書く。<br>（例：内容'+n+'の名称｜内容'+n+'の具体的な説明、など）')};let nextStep=4;document.querySelector('#addStep').onclick=()=>{const sec=[...document.querySelectorAll('section.card[data-title]')].find(x=>x.dataset.title==='4. 本編のポイント');const n=nextStep++;const addField=(key,label,help)=>{const d=document.createElement('div');d.className='field';d.innerHTML='<label>'+label+'</label><div class="help">'+help+'</div><textarea data-key="'+key+'"></textarea>';sec.insertBefore(d,sec.querySelector('[data-key="point_visual"]').parentElement)};addField('point'+n,'ステップ'+n,'ステップのタイトルと内容を書く。<br>（例：ステップ'+n+'の内容、など）');addField('point'+n+'_case','ステップ'+n+'の事例','このステップの事例を書く。<br>（例：このステップで起きた変化、など）');};document.querySelector('#save').onclick=save;document.querySelector('#make').onclick=make;document.querySelector('#json').onclick=()=>dl('ウェビナー回答.json',JSON.stringify(vals(),null,2),'application/json');try{const x=JSON.parse(localStorage.getItem(store)||'{}');document.querySelectorAll('[data-key]').forEach(e=>e.value=x[e.dataset.key]||'')}catch(e){}
</script><script>
(()=>{
 const form=document.querySelector('#form'), actions=document.querySelector('.actions');
 const wrap=document.createElement('div'); wrap.className='progress-wrap'; wrap.style.cssText='position:fixed;left:50%;right:auto;transform:translateX(-50%);bottom:62px;width:min(960px,calc(100% - 32px));box-sizing:border-box;max-height:90px;overflow:auto;z-index:1000;border-left:0;border-right:0;background:#fff;border:1px solid #c8d0da;padding:10px;box-shadow:0 2px 8px #0002'; wrap.innerHTML='<div style="display:flex;justify-content:space-between;font-size:13px;color:#5d6875"><span>入力の進捗</span><strong id="progressText">0%</strong></div><div style="height:10px;background:#e7ebef;border:1px solid #c8d0da"><div id="progressBar" style="height:100%;width:0;background:#8b1e2d"></div></div>'; form.before(wrap);
 const preview=document.createElement('pre'); preview.id='mdPreview'; preview.style.cssText='display:none;margin:18px 0;padding:14px;border:1px solid #c8d0da;background:#f7f8fa;white-space:pre-wrap;max-height:360px;overflow:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace'; actions.after(preview);
 const load=document.createElement('button'); load.type='button'; load.className='secondary'; load.textContent='JSON読込'; const file=document.createElement('input'); file.type='file'; file.accept='.json,application/json'; file.hidden=true; actions.insertBefore(load,document.querySelector('#status')); actions.appendChild(file);
 const fields=()=>[...document.querySelectorAll('[data-key]')];
 const stepLabels=()=>document.querySelectorAll('label').forEach(l=>{l.textContent=l.textContent.replaceAll('ステップ','STEP')});
 stepLabels(); setTimeout(stepLabels,0); new MutationObserver(stepLabels).observe(document.querySelector('#form'),{childList:true,subtree:true});
 const sourceField=document.querySelector('[data-key="sources"]');if(sourceField)sourceField.closest('.field')?.remove();
 const faqSection=[...document.querySelectorAll('section.card[data-title]')].find(x=>x.dataset.title==='7. FAQ・最終確認');if(faqSection){const faqAdd=document.createElement('button');faqAdd.type='button';faqAdd.className='secondary';faqAdd.textContent='＋よくある質問を追加';faqSection.appendChild(faqAdd);let faqNo=2;faqAdd.onclick=()=>{const d=document.createElement('div');d.className='field';d.innerHTML='<label>よくある質問'+faqNo+'と回答</label><div class="help">参加者が迷う質問と、その回答を書く。<br>（例：一人で使うAIと何が違うのか？｜役割を持つAI組織として動かす点が違う、など）</div><textarea data-key="faq'+faqNo+'"></textarea>';faqSection.insertBefore(d,faqAdd);faqNo++;d.querySelector('textarea').addEventListener('input',progress)}}
 function progress(){const a=fields(),n=a.filter(x=>x.value.trim()).length,p=a.length?Math.round(n/a.length*100):0;document.querySelector('#progressBar').style.width=p+'%';document.querySelector('#progressText').textContent=p+'%（'+n+'/'+a.length+'項目）';let nav=document.querySelector('#sectionProgress');if(!nav){nav=document.createElement('div');nav.id='sectionProgress';nav.style.cssText='margin-top:8px;font-size:12px;line-height:1.5;display:flex;gap:10px;flex-wrap:wrap';document.querySelector('#progressText').parentElement.parentElement.parentElement.appendChild(nav)}nav.innerHTML=[...document.querySelectorAll('.card[data-title]')].map(sec=>{const fs=[...sec.querySelectorAll('[data-key]')],done=fs.filter(x=>x.value.trim()).length;return '<div style="border-top:1px solid #e7ebef;padding:4px 0"><a href="#" data-target="'+sec.dataset.title+'" style="color:#172a46;text-decoration:none">'+sec.dataset.title+' '+done+'/'+fs.length+'</a></div>'}).join('');nav.querySelectorAll('a[data-target]').forEach(link=>link.onclick=e=>{e.preventDefault();document.querySelector('[data-title="'+link.dataset.target+'"]')?.scrollIntoView({behavior:'smooth',block:'start'})})}
 function markdown(){let out='# ウェビナー台本\n\n';document.querySelectorAll('.card[data-title]').forEach(s=>{s.querySelectorAll('[data-key]').forEach(x=>{const label=x.closest('.field')?.querySelector('label')?.textContent||'項目';const v=x.value.trim();out+='## '+label+'\n\n'+v+'\n\n';});});return out}
 document.querySelector('#make').onclick=()=>{localStorage.setItem('generic_webinar_hearing_v4',JSON.stringify(Object.fromEntries(fields().map(x=>[x.dataset.key,x.value]))));const out=markdown();preview.textContent=out;preview.style.display='block';document.querySelector('#status').textContent='台本MDを生成しました（画面にも表示）';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/markdown;charset=utf-8'}));a.download='ウェビナー台本_生成.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
 load.onclick=()=>file.click();file.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());fields().forEach(x=>x.value=d[x.dataset.key]??'');localStorage.setItem('generic_webinar_hearing_v4',JSON.stringify(d));document.querySelector('#status').textContent='JSONを読み込みました';progress()}catch{document.querySelector('#status').textContent='JSONを読み込めませんでした'}};
 fields().forEach(x=>x.addEventListener('input',progress));progress();
})();
</script><script>
(()=>{
 document.querySelector('#save')?.remove();
 const actions=document.querySelector('.actions');
 if(actions&&!document.querySelector('#saveNotice')){const n=document.createElement('div');n.id='saveNotice';n.className='help';n.style.cssText='width:100%;margin:0 0 6px;color:#8b1e2d;font-weight:700';n.textContent='入力内容は自動保存されません。ブラウザを閉じる前に「JSON保存」でファイルとして保存してください。保存しない場合、入力内容が消えることがあります。';actions.parentElement.insertBefore(n,actions)}
 const fields=()=>[...document.querySelectorAll('[data-key]')];
 const values=()=>Object.fromEntries(fields().map(x=>[x.dataset.key,x.value]));
 const md=()=>{let o='# ウェビナー台本\n\n';document.querySelectorAll('.card[data-title]').forEach(sec=>{sec.querySelectorAll('[data-key]').forEach(x=>{const label=x.closest('.field')?.querySelector('label')?.textContent||'項目';o+='## '+label+'\n\n'+x.value.trim()+'\n\n'})});return o};
 window._forceSave=()=>{const data=JSON.stringify(values());try{localStorage.setItem('generic_webinar_hearing_v4',data)}catch(e){}const st=document.querySelector('#status');if(st)st.textContent='入力を保存しました（空欄でも保存可能）';return data;};
 window._forceMake=()=>{window._forceSave();const out=md(),pre=document.querySelector('#mdPreview');if(pre){pre.textContent=out;pre.style.display='block'}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/markdown;charset=utf-8'}));a.download='ウェビナー台本_生成.md';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);const st=document.querySelector('#status');if(st)st.textContent='台本MDを生成・保存しました';};
const make=document.querySelector('#make');if(make){make.onclick=null;make.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();window._forceMake()},true)}
})();
</script></body></html>
