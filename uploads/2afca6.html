<script>
(()=>{'use strict';
const TEMPLATE_VERSION='v3',NS='mihon_kansei_gyoseishoshi_sign_v1',SCHEMA_VERSION=8,DB=NS+'_images';let editing=true,moving=false,selected=null,clipboard=null,history=[],future=[],drag=null,resize=null,isRestoring=false,saving=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],status=$('#saveStatus');
const identity=el=>el?.dataset.editId||el?.dataset.frameId||el?.dataset.imageId||el?.dataset.addedId||'';
function imageDB(){return new Promise((ok,no)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('images');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function idbPut(key,value){if(!key)return;let db=await imageDB();await new Promise((ok,no)=>{let t=db.transaction('images','readwrite');t.objectStore('images').put(value,key);t.oncomplete=ok;t.onerror=()=>no(t.error)});db.close()}
async function idbGet(key){let db=await imageDB(),value=await new Promise((ok,no)=>{let t=db.transaction('images','readonly'),q=t.objectStore('images').get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});db.close();return value}
async function idbClear(){let db=await imageDB();await new Promise((ok,no)=>{let t=db.transaction('images','readwrite');t.objectStore('images').clear();t.oncomplete=ok;t.onerror=()=>no(t.error)});db.close()}
function nameOf(el){return el?.dataset.name||identity(el)||'なし'}
function addHandles(el){if(!el||el.dataset.lockPosition==='true'||el.querySelector(':scope>.handle'))return;['n','ne','e','se','s','sw','w','nw'].forEach(d=>{let h=document.createElement('i');h.className='handle';h.dataset.dir=d;h.contentEditable='false';el.append(h)})}
function selectable(){return $$('[data-edit-id],[data-frame-id],[data-image-id],[data-added-id]')}
function select(el){if(selected)selected.classList.remove('selected');selected=el||null;if(selected){selected.classList.add('selected');if(selected!==$('.page'))addHandles(selected)}updateUI()}
function selectedTextTargets(){if(!selected)return[];if(selected.matches('[data-edit-id],.added-text'))return[selected];return [...selected.querySelectorAll('[data-edit-id],.added-text')]}function updateUI(){let text=!!selected?.dataset.editId||selected?.classList.contains('added-text'),frame=!!selected?.dataset.frameId,img=!!selected?.dataset.imageId,locked=selected?.dataset.lockPosition==='true',textTargets=selectedTextTargets();$('#selection').textContent='選択：'+(selected?(text?'文字「':img?'画像「':'枠「')+nameOf(selected)+'」／移動'+(locked?'不可':'可')+'／削除'+(locked?'不可':'可'):'なし');$('#fontSize').disabled=!text;$('#textColor').disabled=!textTargets.length;$$('.align').forEach(x=>x.disabled=!text);['#bgColor','#borderColor','#borderWidth','#borderStyle'].forEach(id=>$(id).disabled=!frame);['#opacityRange','#opacityNumber'].forEach(id=>$(id).disabled=!selected);$('#fitBtn').disabled=!img;$('#replaceImage').disabled=!img;$('#deleteBtn').disabled=!selected||locked;$('#copyBtn').disabled=!(frame||img)||locked;$('#pasteBtn').disabled=!clipboard;$('#moveBtn').disabled=!editing;$('#undoBtn').disabled=!history.length;$('#redoBtn').disabled=!future.length;if(selected){let op=Math.round((parseFloat(getComputedStyle(selected).opacity)||0)*100);$('#opacityRange').value=op;$('#opacityNumber').value=op}if(textTargets.length)$('#textColor').value=rgbHex(getComputedStyle(textTargets[0]).color);if(text)$('#fontSize').value=Math.round(parseFloat(getComputedStyle(selected).fontSize));if(frame){let cs=getComputedStyle(selected);$('#bgColor').value=rgbHex(cs.backgroundColor);$('#borderColor').value=rgbHex(cs.borderColor);$('#borderWidth').value=parseFloat(cs.borderWidth)||0;$('#borderStyle').value=cs.borderStyle||'none'}if(img)$('#fitBtn').textContent='画像：'+(getComputedStyle(selected.querySelector('img')).objectFit==='cover'?'枠いっぱい':'全体を表示')}
function rgbHex(v){let m=v.match(/\d+/g);if(!m||m.length<3)return'#000000';return'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('')}
function cleanHTML(e){let c=e.cloneNode(true);c.querySelectorAll('.handle,img').forEach(h=>h.remove());return c.innerHTML}function snapshot(){let s={schemaVersion:SCHEMA_VERSION,text:{},frames:{},positions:{},images:{},added:[],deleted:[]};$$('[data-edit-id]').forEach(e=>s.text[e.dataset.editId]={html:cleanHTML(e),style:e.getAttribute('style')||''});$$('[data-frame-id]').forEach(e=>s.frames[e.dataset.frameId]={backgroundColor:e.style.backgroundColor||'',border:e.style.border||'',opacity:e.style.opacity||''});$$('[data-image-id]').forEach(e=>s.images[e.dataset.imageId]={style:e.getAttribute('style')||'',fit:e.querySelector('img')?.style.objectFit||'',custom:e.dataset.customImage==='true'});$$('[data-edit-id],[data-frame-id],[data-image-id]').filter(e=>e.dataset.lockPosition!=='true').forEach(e=>s.positions[identity(e)]={transform:e.style.transform||'',width:e.style.width||'',height:e.style.height||'',left:e.style.left||'',top:e.style.top||''});$$('[data-added-id]').forEach(e=>s.added.push({id:e.dataset.addedId,type:e.dataset.type,html:e.dataset.type==='image'?'':cleanHTML(e),style:e.getAttribute('style')||'',custom:e.dataset.customImage==='true'}));$$('.is-deleted').forEach(e=>s.deleted.push(identity(e)));return s}
function pushHistory(){if(isRestoring)return;history.push(JSON.stringify(snapshot()));if(history.length>50)history.shift();future=[];updateUI()}
async function hydrateImages(s){let jobs=[];Object.entries(s.images||{}).forEach(([id,v])=>{let e=document.querySelector(`[data-image-id="${CSS.escape(id)}"]`);if(!e)return;let im=e.querySelector('img');if(!im){im=document.createElement('img');im.draggable=false;e.prepend(im)}im.style.objectFit=v.fit||'contain';if(v.src){jobs.push(idbPut(id,v.src).then(()=>{delete v.src;v.custom=true}))}if(v.custom)jobs.push(idbGet(id).then(src=>{if(src){im.src=src;e.dataset.customImage='true';e.classList.remove('empty')}}))});(s.added||[]).filter(v=>v.type==='image'&&v.custom).forEach(v=>{if(v.src)jobs.push(idbPut(v.id,v.src).then(()=>delete v.src));jobs.push(idbGet(v.id).then(src=>{let e=document.querySelector(`[data-added-id="${CSS.escape(v.id)}"]`),im=e?.querySelector('img');if(src&&im){im.src=src;e.dataset.customImage='true';e.classList.remove('empty')}}))});await Promise.all(jobs)}
